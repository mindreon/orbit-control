name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go vet -tags e2e ./...
      - run: go test -race -count=1 ./...

      - name: Bootstrap control roles and database
        env:
          PGPASSWORD: ci-superuser
        run: |
          psql -v ON_ERROR_STOP=1 \
            -v owner_password=ci-owner -v app_password=ci-app \
            -h 127.0.0.1 -U postgres -d postgres \
            -f deploy/postgres/bootstrap-roles.sql

      # Contract §18 E2E: migrations up -> down -> up, then S-DB-11 and
      # S-DB-13 through the HTTP API; writes the report even on failure.
      - name: E2E persistence
        env:
          # Throwaway CI-only credentials for the service container above.
          ORBIT_TEST_DB_URL: postgres://orbit_app:ci-app@127.0.0.1:5432/orbit_control?sslmode=disable
          ORBIT_TEST_MIGRATE_DB_URL: postgres://orbit_owner:ci-owner@127.0.0.1:5432/orbit_control?sslmode=disable
          ORBIT_E2E_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: go test -tags e2e -race -count=1 -v ./e2e/...

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-persistence-report
          path: artifacts/e2e-persistence-report.json
          if-no-files-found: error
