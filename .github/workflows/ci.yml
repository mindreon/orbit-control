name: ci
on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-postgres
          POSTGRES_DB: orbit
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # This credential exists only in this job's disposable service container.
      PGPASSWORD: ci-disposable-postgres
      ORBIT_TEST_DATABASE_URL: postgres://postgres:ci-disposable-postgres@127.0.0.1:5432/orbit?sslmode=disable
      ORBIT_REQUIRE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap disposable test roles (migrations never create roles)
        run: |
          psql -h 127.0.0.1 -U postgres -d orbit -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE orbit_owner BYPASSRLS;
          CREATE ROLE orbit_app NOBYPASSRLS;
          CREATE ROLE orbit_worker NOBYPASSRLS;
          ALTER DATABASE orbit OWNER TO orbit_owner;
          ALTER SCHEMA public OWNER TO orbit_owner;
          SQL
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Contract generation and cross-language fixture freshness
        run: |
          bash scripts/check-contracts-gen.sh
          go test ./internal/contract -run TestGoWireFixtures -count=1
      - run: bash scripts/check-openapi.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
