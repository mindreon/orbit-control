name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway CI-only credentials for the service container above.
      ORBIT_TEST_DB_URL: postgres://orbit_app:ci-app@127.0.0.1:5432/orbit_control?sslmode=disable
      ORBIT_TEST_MIGRATE_DB_URL: postgres://orbit_owner:ci-owner@127.0.0.1:5432/orbit_control?sslmode=disable
      ORBIT_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Bootstrap control roles and database
        env:
          PGPASSWORD: ci-superuser
        run: |
          psql -v ON_ERROR_STOP=1 \
            -v owner_password=ci-owner -v app_password=ci-app \
            -h 127.0.0.1 -U postgres -d postgres \
            -f deploy/postgres/bootstrap-roles.sql

      - run: go vet ./...

      # Includes S-DB-11 and S-DB-13; the pgstore TestMain runs
      # migrations up -> down -> up first (§18.2).
      - run: go test -race -count=1 ./...
