name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # orbit-runtime commit whose published image (ghcr.io/mindreon/orbit-runtime:<sha>)
  # runs orbit-orch and orbit-worker; the runner pins it by digest in the report.
  ORBIT_RUNTIME_REF: f8addbccc8f3ffc360ddccf3717f4d094c39f7ee

jobs:
  # QA sign-off E-LE-1..4: real Temporal, orbit-orch, orbit-worker, and orbit-control.
  real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The PR head itself, not the merge commit, so the report names the head SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: E-LE run 1
        run: go run ./e2e/realstack run -runtime-commit "$ORBIT_RUNTIME_REF" -out artifacts/e2e-real-stack.json -logs e2e-logs/run1

      - name: E-LE run 2 must match run 1
        run: |
          go run ./e2e/realstack run -runtime-commit "$ORBIT_RUNTIME_REF" -out e2e-rerun/e2e-real-stack.json -logs e2e-logs/run2
          cmp artifacts/e2e-real-stack.json e2e-rerun/e2e-real-stack.json
          cp e2e-rerun/e2e-real-stack.json artifacts/e2e-real-stack.rerun.json
          sha256sum artifacts/e2e-real-stack.json artifacts/e2e-real-stack.rerun.json | tee artifacts/e2e-real-stack.sha256

      - name: Secret scan of the E2E reports and all process logs
        run: |
          go run ./e2e/realstack scan artifacts/e2e-real-stack.json artifacts/e2e-real-stack.rerun.json e2e-logs/run1/*.log e2e-logs/run2/*.log -out artifacts/e2e-real-stack-secret-scan.json
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir artifacts --no-banner --redact --report-format json --report-path /tmp/gitleaks.json
          cp /tmp/gitleaks.json artifacts/e2e-real-stack-gitleaks.json
          /tmp/gitleaks dir e2e-logs --no-banner --redact --report-format json --report-path /tmp/gitleaks-logs.json
          cp /tmp/gitleaks-logs.json artifacts/e2e-logs-gitleaks.json

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-stack
          path: artifacts/
          if-no-files-found: error

      # Full stdout and stderr of every process (control, orch, worker, Temporal); the step above scans them.
      - name: Upload E2E process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-stack-process-logs
          path: e2e-logs/
          if-no-files-found: error
