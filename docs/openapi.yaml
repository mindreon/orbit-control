components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OIDC/dev JWT or orbit_ API key; selected tenant requires active membership.
  parameters:
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 256}
    EventTypes:
      name: types
      in: query
      description: Comma-separated EventType allowlist; mutually exclusive with exclude.
      schema: {type: string}
    EventExclude:
      name: exclude
      in: query
      description: Comma-separated EventType denylist; mutually exclusive with types.
      schema: {type: string}
    Tenant:
      name: X-Orbit-Tenant
      in: header
      required: true
      schema:
        type: string
        format: uuid
    OptionalTenant:
      name: X-Orbit-Tenant
      in: header
      required: false
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from the previous page; omit for the first page.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 256
      description: Optional 24-hour encrypted replay within a tenant. Reuse with different method, URI or body returns 422. Available for dev login when a tenant exists.
    WorkspaceId:
      name: w
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrincipalId:
      name: p
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Structured error. 400 invalid JSON/cursor/limit/tenant; 401 invalid credentials; 403 forbidden; 404 absent or unreadable resource; 409 conflict; 413 body too large; 422 invalid input or idempotency mismatch; 500 transient internal failure; 503 database unavailable. retryable indicates whether retrying may succeed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: Operation completed
    Health:
      description: Service is healthy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Workspace:
      description: Workspace representation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workspace'
  schemas:
    RunEvent:
      $ref: '../contract/v2/schema/run_event.json#/$defs/RunEvent'
    RunEventPage:
      type: object
      required: [items, resume_from]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        next_cursor:
          type: string
          description: Present only for a non-final history page; use as after to continue history with the same filter.
          pattern: '^[0-9]+$'
        resume_from:
          type: string
          description: Safe SSE cursor for the same filter; last returned sequence on non-final pages, max(after, safety floor) on final pages.
          pattern: '^[0-9]+$'
    AssetInput:
      type: object
      additionalProperties: false
      required:
        - kind
        - name
        - visibility
      properties:
        kind:
          type: string
          enum:
            - agent
            - skill
            - mcp_server
            - team
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{2,63}$
        visibility:
          type: string
          enum:
            - private
            - workspace
            - tenant
        workspace_id:
          type: string
          format: uuid
    AssetPatch:
      type: object
      additionalProperties: false
      required:
        - visibility
      properties:
        visibility:
          type: string
          enum:
            - private
            - workspace
            - tenant
    Asset:
      type: object
      required:
        - id
        - publisher
        - kind
        - name
        - visibility
        - owner_id
        - status
        - created_at
        - display_name
        - description
      properties:
        display_name:
          type: [string, 'null']
          readOnly: true
          description: Agent displayName from the stable version, selecting zh, then zh-CN, then en, then the value with the lowest locale key; null when absent.
        description:
          type: [string, 'null']
          readOnly: true
          description: Agent or team description from the stable version; null when absent.
        id:
          type: string
          format: uuid
        publisher:
          type: string
        kind:
          type: string
          enum:
            - agent
            - skill
            - mcp_server
            - team
        name:
          type: string
        visibility:
          type: string
          enum:
            - private
            - workspace
            - tenant
        workspace_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - suspended
            - archived
        created_at:
          type: string
          format: date-time
    AssetVersion:
      type: object
      required:
        - id
        - asset_id
        - version
        - manifest
