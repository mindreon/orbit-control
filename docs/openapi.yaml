        name:
          type: string
        summary:
          type: string
        author:
          type: string
        category:
          type: string
        categoryName:
          type: string
        categoryMore:
          type: integer
        calls:
          type: integer
        views:
          type: integer
        stars:
          type: integer
        verified:
          type: boolean
        hosted:
          type: boolean
        needsOnline:
          type: boolean
          description: True when the server cannot be used without a network.
    McpMarketToolParam:
