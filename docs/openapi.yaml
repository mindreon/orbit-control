openapi: 3.0.3
info:
  title: Orbit Control API
  version: 0.2.0-w1
  description: |
    W1 **live rooms**. Health, rooms, messages, approvals, room activity history,
    steer, and SSE events are implemented in-memory. Control calls orbit-worker
    HTTP activities directly, or RoomWorkflow when Temporal is configured. It
    still has no database or OAuth.

    Product surfaces:

    - **Super single-agent** — rooms `kind=solo` (W1)
    - **Multi-agent** — rooms `kind=collab`, per-room agent catalog (later)
    - **Cloud Agent** — `/v1/cloud-agents` jobs (later)

    The agent loop runs on orbit-worker as AgentScope. This API does not
    require `kernel=dsh` or `protocol=acp`, and it never exposes Temporal
    or worker URLs.

    `Unauthorized` (401) and `Forbidden` (403) are reserved shapes for later
    Sentinel tests. They are not emitted in W1.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local W1 control (in-memory rooms + HITL)
# W1 intentionally has no authentication. Later security schemes replace this
# root-level declaration; the reserved 401/403 response bodies stay stable.
security: []
tags:
  - name: health
    description: Liveness
  - name: rooms
    description: Conversation / work rooms (W1 in-memory)
  - name: messages
    description: Room messages (W1 in-memory)
  - name: approvals
    description: Human-in-the-loop approvals (W1 in-memory)
  - name: personas
    description: Agent personas (W2 in-memory catalog)
  - name: secrets
    description: Tenant secrets metadata only (unimplemented; plaintext never in API)
  - name: cloud-agents
    description: Cloud agent jobs (unimplemented)
  - name: websocket
    description: Public WebSocket upgrade (unimplemented)
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: "W1 returns 200 `{status: ok}` without a database."
      x-unimplemented: false
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms
      x-unimplemented: false
      responses:
        "200":
          description: Room list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room
      description: |
        `kind=solo` is the super single-agent room. Opens a session on
        orbit-worker. `permissionPreset` is pinned on that room and forwarded
        with the session (`workspace-write`, `read-only`, or
        `danger-full-access`). `danger-full-access` applies only to this
        room, not as a global client switch. `kind=collab` is accepted but
        still one parent session in W1.
      x-unimplemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "200":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "502":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get a room
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/messages:
    get:
      tags: [messages]
      operationId: listRoomMessages
      summary: List messages in a room
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [messages]
      operationId: createRoomMessage
      summary: Post a message to a room
      description: Human turn text. Control calls worker `runTurn` (W1 stand-in for Temporal).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomMessageRequest"
      responses:
        "200":
          description: Room after the turn, plus a pending approval when parked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMessageResponse"
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/steer:
    post:
      tags: [rooms]
      operationId: steerRoom
      summary: Steer a running room
      description: |
        Maps to Temporal Signal `steer`, or the worker Activity on the direct
        W1 path. Legal only while the room is running.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SteerRequest"
      responses:
        "200":
          description: Steer accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/abort:
    post:
      tags: [rooms]
      operationId: abortRoom
      summary: Abort a room
      description: Calls worker `abort` (W1 stand-in for Temporal Signal `abort`).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortRequest"
      responses:
        "200":
          description: Room aborted
          content:
            application/json:
              schema:
                type: object
                required: [aborted]
                properties:
                  aborted:
                    type: boolean
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/events:
    get:
      tags: [rooms]
      operationId: streamRoomEvents
      summary: SSE room events
      description: |
        W1 stand-in for public WebSocket. orbit-web subscribes here only.
        Every frame is a default SSE `message` whose `data:` is an
        `EventEnvelope` (never raw ACP); switch on `data.type`.

        **Event ids.** Every message carries `id: <n>`, where `n` is
        `EventEnvelope.id`: the event's id from one process-global in-memory
        counter shared by all rooms. Within a room ids strictly increase but
        are not contiguous. The counter restarts with control, so ids issued
        before a restart are unknown afterwards.

        **Resume.** Send the last id you received as the `Last-Event-ID`
        header (browsers do this on EventSource auto-reconnect) or as the
        `lastEventId` query parameter. The header wins when both are present.
        The cursor must be `0` or the id of an event of **this** room.
        Control replays this room's retained events with a greater id, in
        order, then switches to live with no duplicates and no gaps. Without
        a cursor the stream is live-only, as before.

        **Reset.** If the cursor is malformed, unknown (not an event of this
        room — e.g. another room's id, an id beyond the latest issued, or any
        id issued before a control restart), or older than the earliest
        retained event (activity keeps the last 500 per room), the first
        message is a `reset` envelope (payload `ResetPayload`) whose `id:` is
        this room's latest event id. Refetch the room, messages, and
        activity, then keep reading this stream; it continues live after
        `payload.lastId`. Rooms are also in memory, so after a restart the
        room itself is usually gone and the request gets `404` before any
        stream opens.

        **assistant.delta** envelopes are live-only: not stored, no envelope
        `id`, never replayed, and never counted against the 500-event
        window. Their SSE `id:` repeats the id of the last durable event
        delivered on this connection. Clients drop partial drafts on
        reconnect.

        Comment lines `: connected` and `: heartbeat` (about every 15s) keep
        proxies from idling the connection; they carry no id.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume cursor, the last event id received (decimal).
          schema:
            type: string
          example: "42"
        - name: lastEventId
          in: query
          required: false
          description: EventSource fallback for `Last-Event-ID`; ignored when the header is set.
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: |
            `text/event-stream` with `Cache-Control: no-cache` and
            `X-Accel-Buffering: no`. Each `data:` is an `EventEnvelope`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-cache]
            X-Accel-Buffering:
              schema:
                type: string
                enum: ["no"]
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "404":
          description: Room not found. Returned before any stream is opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: not found
                code: NOT_FOUND
                message: room not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/activity:
    get:
      tags: [rooms]
      operationId: listRoomActivity
      summary: List the room execution timeline
      description: |
        Returns the room's retained durable events (last 500), oldest first,
        as `EventEnvelope`s with the producer's payload passed through
        unchanged. `assistant.delta` is never included. The response never
        contains raw dsh or ACP frames.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room activity, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEventList"
        "404":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/agents:
    get:
      tags: [rooms]
      operationId: listRoomAgents
      summary: List agents in a room (unimplemented)
      description: |
        Parent session plus projected subagent catalog. Used by collab rooms
        and by solo rooms that spawned children.
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approvals
      x-unimplemented: false
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals/{approvalId}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Get an approval (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals/{approvalId}/decide:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject
      description: |
        Public HITL verb. Control maps `allow` to worker `resolveApproval`
        (`allowed-once`) then `runTurn` resume. `reject` maps to worker `abort`.
        Temporal Update/Signal is the later stand-in target.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/personas:
    get:
      tags: [personas]
      operationId: listPersonas
      summary: List personas
      x-unimplemented: false
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [personas]
      operationId: createPersona
      summary: Create a persona (unimplemented)
      description: |
        Stored here. The worker renders it into a dsh agent preset at
        openSession. This API never accepts secret plaintext inside a persona.
      x-unimplemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonaRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/personas/{personaId}:
    get:
      tags: [personas]
      operationId: getPersona
      summary: Get a persona (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/PersonaId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: List secret metadata (unimplemented)
      description: |
        Returns names and status only. Plaintext secret values are never
        included in request or response examples.
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [secrets]
      operationId: putSecret
      summary: Store a secret (unimplemented)
      description: Ciphertext is owned only by orbit-control. Body is a placeholder.
      x-unimplemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceholderObject"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/secrets/{secretId}:
    get:
      tags: [secrets]
      operationId: getSecretMetadata
      summary: Get secret metadata (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: Delete a secret (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents:
    get:
      tags: [cloud-agents]
      operationId: listCloudAgents
      summary: List cloud agent jobs (unimplemented)
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [cloud-agents]
      operationId: createCloudAgent
      summary: Start a cloud agent job (unimplemented)
      description: |
        Control starts Temporal workflow `CloudAgentJob`. GitHub and other
        webhooks also land here — not on dsh webhookRuntime.
      x-unimplemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCloudAgentRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents/{agentId}:
    get:
      tags: [cloud-agents]
      operationId: getCloudAgent
      summary: Get a cloud agent job (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents/{agentId}/cancel:
    post:
      tags: [cloud-agents]
      operationId: cancelCloudAgent
      summary: Cancel a cloud agent job (unimplemented)
      description: Maps to Temporal Signal `abort` on CloudAgentJob.
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /ws:
    get:
      tags: [websocket]
      operationId: upgradeWebSocket
      summary: Public WebSocket upgrade (unimplemented)
      description: |
        Placeholder for the public WS surface. orbit-web will subscribe here
        only — never to orch, worker, or dsh sockets.

        Later frames are `OrbitEvent` objects (session.status, assistant.message,
        tool.call, tool.result, approval.asked, agent.started, agent.finished,
        usage). Raw dsh/ACP payloads are not forwarded.
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
    PersonaId:
      name: personaId
      in: path
      required: true
      schema:
        type: string
    SecretId:
      name: secretId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error, code, message]
      properties:
        error:
          type: string
          description: Stable machine-oriented slug
        code:
          type: string
          description: Stable machine-oriented code (Sentinel asserts this)
        message:
          type: string
          description: Human-readable explanation (not a secret)
      example:
        error: not implemented
        code: NOT_IMPLEMENTED
        message: "W0 skeleton: this endpoint is not implemented"
    PlaceholderObject:
      type: object
      additionalProperties: true
      description: W0 request placeholder. No business fields yet.
    RoomKind:
      type: string
      enum: [solo, collab]
      description: solo = super single-agent; collab = multi-agent catalog in one room
    PermissionPreset:
      type: string
      enum: [workspace-write, read-only, danger-full-access]
      description: |
        Closed presets the AgentScope worker already accepts. Default is
        `workspace-write`. `read-only` is explore-only. `danger-full-access`
        is explicit and applies only to the room or cloud-agent job that
        sets it — not a global client switch.
    RoomState:
      type: string
      enum: [idle, running, awaiting_approval, closed]
    Room:
      type: object
      additionalProperties: false
      required: [id, kind, title, state, permissionPreset, runtime, createdAt]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/RoomKind"
        title:
          type: string
        state:
          $ref: "#/components/schemas/RoomState"
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
        runtime:
          $ref: "#/components/schemas/RuntimeSnapshot"
        sessionId:
          type: string
        createdAt:
          type: string
    RuntimeSnapshot:
      type: object
      additionalProperties: false
      required: [kernel, protocol, isolation]
      properties:
        kernel:
          type: string
          description: |
            Runtime identity on the room snapshot. The live worker is
            `agentscope`. `dsh` is not required.
          example: agentscope
        protocol:
          type: string
          description: |
            Session protocol when the runtime has one. `acp` is not required.
            AgentScope rooms leave this empty; they do not speak ACP.
        isolation:
          type: string
          enum: [process]
          description: Per-session process isolation recorded on the room snapshot.
    RoomList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Room"
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, roomId, role, text, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        role:
          type: string
        type:
          type: string
        text:
          type: string
        createdAt:
          type: string
    MessageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    Approval:
      type: object
      additionalProperties: false
      required: [id, roomId, status, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        sessionId:
          type: string
        approvalRequestId:
          type: string
        toolName:
          type: string
        reason:
          type: string
        status:
          type: string
        decision:
          type: string
        createdAt:
          type: string
    ApprovalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [type, taskId, ts, source, payload]
      description: |
        One room (task) event on `/activity` and SSE: typed routing fields
        plus the producer's payload. **BREAKING** vs the former flat
        `ActivityEvent`: fields such as `text`, `toolName`, `role`,
        `status`, and `reason` now live under `payload`, and `sequence` is
        now `id`.
      properties:
        id:
          type: integer
          format: int64
          description: |
            Event id from one process-global counter shared by all rooms;
            strictly increasing within a room, not contiguous, and reset when
            control restarts. This is the event's SSE `id:`. Absent on
            live-only envelopes (`assistant.delta`, `reset`).
        type:
          type: string
          description: |
            Worker types are `OrbitEvent.type` (orbit-runtime A1 schema).
            Control also emits `session.status`, `assistant.message` (user
            turns), `approval.asked`, `room.steered`, and `reset` (SSE only).
          example: tool.result
        taskId:
          type: string
          description: Room id (room = task, contract C29).
        ts:
          type: string
          format: date-time
          description: The payload's `occurredAt` when present, otherwise when control received it.
        source:
          type: string
          enum: [control, worker]
        payload:
          anyOf:
            - $ref: "#/components/schemas/ResetPayload"
            - type: object
              additionalProperties: true
          description: |
            `source=worker`: the ingested `OrbitEvent` body, unchanged
            (camelCase; whitespace compacted), including fields control does
            not interpret — e.g. `delta`, `blockId`, `seq`,
            `activityAttempt`, `argsPreview`, `toolState`, `truncated`,
            `agentId`, `agentPath`, `turnId`, `failure`, and usage counters.
            `source=control`: control's own event fields plus `roomId`,
            `occurredAt`, `runtime`, and `permissionPreset`. `type=reset`:
            `ResetPayload`.
      example:
        id: 42
        type: tool.result
        taskId: rm_0123456789abcdef
        ts: "2026-09-26T14:00:00.123456+00:00"
        source: worker
        payload:
          type: tool.result
          roomId: rm_0123456789abcdef
          sessionId: sess-1
          toolName: bash
          callId: c1
          toolState: success
          truncated: false
          text: README.md
          agentId: main
          agentPath: main
          turnId: tn_1
          occurredAt: "2026-09-26T14:00:00.123456+00:00"
    ResetPayload:
      type: object
      additionalProperties: false
      required: [reason, lastId]
      description: |
        Payload of a `type=reset` envelope (no envelope `id`, `source=control`),
        sent as the first SSE message when a resume cursor cannot be
        honoured. Control never silently skips: refetch
        `GET /v1/rooms/{roomId}`, `/messages`, and `/activity`, then keep
        reading the same stream, which continues live after `lastId`. The
        frame's SSE `id:` is `lastId`.
      properties:
        reason:
          type: string
          enum: [malformed, unknown, expired]
          description: |
            `malformed` — not a canonical decimal id. `unknown` — not an event
            of this room: another room's id, beyond the latest issued id, or
            issued before a control restart. `expired` — older than the
            earliest retained event of this room.
        lastId:
          type: integer
          format: int64
          description: |
            This room's latest event id at reset time (0 if none); the stream
            resumes after it.
      example:
        reason: expired
        lastId: 812
    ActivityEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventEnvelope"
    PostMessageResponse:
      type: object
      additionalProperties: false
      required: [room]
      properties:
        room:
          $ref: "#/components/schemas/Room"
        approval:
          $ref: "#/components/schemas/Approval"
    CloudAgentJobState:
      type: string
      enum: [queued, running, awaiting_approval, succeeded, failed, cancelled]
    CreateRoomRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/RoomKind"
        personaId:
          type: string
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
        title:
          type: string
    CreateRoomMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/TurnAttachment"
    TurnAttachment:
      type: object
      additionalProperties: false
      required: [name, contentType, urlOrBlobRef]
      properties:
        name:
          type: string
        contentType:
          type: string
        urlOrBlobRef:
          type: string
          description: Pointer only — not file bytes
    SteerRequest:
      type: object
      additionalProperties: false
      required: [instruction]
      properties:
        instruction:
          type: string
    AbortRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    DecideApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, reject]
          description: allow → allowed-once on the worker; reject → abort by default
    CreatePersonaRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        instructions:
          type: string
          description: Rendered by the worker into a dsh persona prefix. No secrets.
        mcpServerIds:
          type: array
          items:
            type: string
    CreateCloudAgentRequest:
      type: object
      additionalProperties: false
      required: [repoUrl, prompt]
      properties:
        repoUrl:
          type: string
        branch:
          type: string
        prompt:
          type: string
        personaId:
          type: string
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
    OrbitEvent:
      type: object
      additionalProperties: true
      required: [type]
      description: |
        Worker ingest body (internal `/internal/events`), camelCase, as in
        orbit-runtime `schema/OrbitEvent.json` (A1) — never raw ACP
        session/update. Control validates `type` (unknown types are 400),
        `roomId`/`sessionId`, and `occurredAt`, then stores or streams the
        body unchanged as `EventEnvelope.payload`. `assistant.delta` is
        fanned out over SSE only: never stored, never replayed, never
        counted against the 500-event window.
      properties:
        type:
          type: string
          enum:
            - session.status
            - assistant.message
            - assistant.delta
            - tool.call
            - tool.result
            - approval.asked
            - approval.resolved
            - question.asked
            - question.answered
            - todo.updated
            - usage
            - agent.started
            - agent.finished
            - agent.spawn_rejected
            - turn.failed
        roomId:
          type: string
        jobId:
          type: string
        sessionId:
          type: string
        turnId:
          type: string
        eventId:
          type: string
        occurredAt:
          type: string
          format: date-time
        runtime:
          type: string
          description: |
            Runtime that produced the event. The AgentScope worker sends
            `agentscope`. `dsh` is not required.
          example: agentscope
        protocol:
          type: string
          description: Session protocol when present. `acp` is not required.
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
  responses:
    NotImplemented:
      description: W0 skeleton — path is not implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: not implemented
            code: NOT_IMPLEMENTED
            message: "W0 skeleton: this endpoint is not implemented"
    Unauthorized:
      description: |
        Stub for later Sentinel tests. Missing or invalid credentials.
        W0 does not emit this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: unauthorized
            code: UNAUTHORIZED
            message: missing or invalid credentials
    Forbidden:
      description: |
        Stub for later Sentinel tests. Authenticated caller lacks permission.
        W0 does not emit this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: forbidden
            code: FORBIDDEN
            message: insufficient permissions
