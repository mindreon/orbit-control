        stored:
          type: integer
          description: Catalog size after the needsOnline filter, before keyword and category.
        plazaTotal:
          type: integer
          description: Count labeled on the upstream plaza. The stored snapshot can be smaller.
        page:
          type: integer
        pageSize:
          type: integer
    McpMarketCategory:
      type: object
