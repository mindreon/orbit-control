components:
  schemas:
    Task:
      type: object
      required:
      - task_id
      - tenant_id
      - workflow_id
      - title
      - goal
      - mode
      - status
      - profile
      - plan_version
      properties:
        task_id:
          type: string
          pattern: ^task_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        tenant_id:
          type: string
        workflow_id:
          type: string
        title:
          type: string
        goal:
          type: string
        mode:
          type: string
          enum:
          - single
          - multi
          - long
        status:
          type: string
        profile:
          type: string
        plan_version:
          type: integer
          minimum: 1
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        budgets:
          type: object
          additionalProperties: true
        usage:
          type: object
          additionalProperties: true
        pending_approvals:
          type: array
          items:
            type: string
        policy:
          $ref: '#/components/schemas/Policy'
    Profile:
      type: object
      required:
      - profile_id
      - version
      - ref
      - spec
      - created_at
      properties:
        profile_id:
          type: string
        version:
          type: integer
          minimum: 1
        ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*@[1-9][0-9]*$
        spec:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    ExpertInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        instructions:
          type: string
          maxLength: 20000
          description: Appended to the agent's system prompt
        model:
          type: string
          maxLength: 100
          description: Another model of the worker's provider; ignored under a mock model
        connector_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
          description: Ids of the tenant's MCP connectors
        skill_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
          description: Catalog skills the expert brings by default (each needs a SKILL.md and readable text)
    Expert:
      type: object
      required:
      - expert_id
      - ref
      - version
      - name
      properties:
        expert_id:
          type: string
        ref:
          type: string
          description: '"<expert_id>@<version>", what a task names as its profile'
        version:
          type: integer
          minimum: 1
        name:
          type: string
        instructions:
          type: string
        model:
          type: string
        connector_ids:
          type: array
          items:
            type: string
        skill_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    RegisterProfileRequest:
      type: object
      required:
      - profile_id
      - version
      - spec
      properties:
        profile_id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        spec:
          type: object
          additionalProperties: true
    Policy:
      type: object
      description: What an attempt may do. Tenant, task and profile layers only tighten each other.
      properties:
        denied_tools:
          type: array
          items:
            type: string
            minLength: 1
        exploration_max_tool_calls:
          type: integer
          minimum: 0
    SOP:
      type: object
      required:
      - sop_id
      - version
      - ref
      - steps
      - created_at
      properties:
        sop_id:
          type: string
        version:
          type: integer
          minimum: 1
        ref:
          type: string
          description: sop_id@version, what a sop_stage node names
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SOPStep'
        created_at:
          type: string
          format: date-time
    RegisterSOPRequest:
      type: object
      required:
      - sop_id
      - version
      - steps
      properties:
        sop_id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        steps:
          type: array
          minItems: 1
          description: A step is an object, or a bare string standing for a step whose subject and description are
            that text.
          items:
            oneOf:
            - type: string
              minLength: 1
            - $ref: '#/components/schemas/SOPStep'
    SOPStep:
      type: object
      required:
      - subject
      properties:
        subject:
          type: string
          minLength: 1
        description:
          type: string
          description: What the step must achieve; defaults to the subject
        max_attempts:
          type: integer
          minimum: 1
          description: Refusals before the SOP gives up on the step; defaults to 3
    ArtifactManifest:
      type: object
      required:
      - manifest_id
      - task_id
      - entries
      - created_at
      properties:
        manifest_id:
          type: string
        task_id:
          type: string
        attempt_id:
          type: string
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
        manifest_hash:
          type: string
        created_at:
          type: string
          format: date-time
    TaskConfigInput:
      type: object
      description: |
        What a task runs with. skills and connector_ids are the complete sets to use: null (or absent) keeps the
        expert's defaults, an empty list removes them.
      properties:
        expert:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*@[1-9][0-9]*$
          description: A profile or expert version. Absent keeps the task's profile.
        skills:
          type: array
          nullable: true
          maxItems: 20
          uniqueItems: true
          items:
            type: string
          description: Catalog skill ids ("handle/slug") that have a SKILL.md and readable text; others are refused
        connector_ids:
          type: array
          nullable: true
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        mode:
          type: string
          enum:
          - default
          - plan
          - ask
          default: default
          description: ask runs read-only
    TaskConfigView:
      type: object
      required:
      - config_version
      - mode
      properties:
        config_version:
          type: integer
          minimum: 1
        expert:
          type: string
          nullable: true
        skills:
          type: array
          nullable: true
          items:
            type: string
        connector_ids:
          type: array
          nullable: true
          items:
            type: string
        mode:
          type: string
    CreateTaskRequest:
      type: object
      required:
      - title
      - goal
      properties:
        title:
          type: string
          minLength: 1
        goal:
          type: string
          minLength: 1
        mode:
          type: string
          enum:
          - single
          - multi
          - long
          default: single
        profile:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*@[1-9][0-9]*$
        sop:
          type: string
        budgets:
          type: object
          additionalProperties: true
        policy:
          $ref: '#/components/schemas/Policy'
        config:
          $ref: '#/components/schemas/TaskConfigInput'
          description: 'The task layer of the policy: it can only tighten the tenant layer.'
    SendTaskMessageRequest:
      type: object
      required:
      - text
      properties:
        command_id:
          type: string
        client_message_id:
          type: string
        text:
          type: string
          minLength: 1
        delivery:
          type: string
          enum:
          - queue
          - interrupt
          default: queue
    TaskControlRequest:
      type: object
      required:
      - action
      properties:
        command_id:
          type: string
        action:
          type: string
          enum:
          - pause
          - resume
          - stop
          - cancel
          - takeover
          - handback
        reason:
          type: string
    DecideTaskApprovalRequest:
      type: object
      required:
      - decision
      properties:
        command_id:
          type: string
        decision:
          type: string
          enum:
          - approve
          - reject
        comment:
          type: string
        always:
          type: boolean
          description: With approve, also allow what the approval offered (its subject's allow_rule) for the rest of the task.
    GrantBudgetRequest:
      type: object
      required:
      - delta
      properties:
        command_id:
          type: string
        delta:
          type: object
          additionalProperties: true
    RequestProfileSwitchRequest:
      type: object
      required:
      - node_id
      - to_profile
      - reason
      properties:
        command_id:
          type: string
        node_id:
          type: string
        to_profile:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*@[1-9][0-9]*$
        reason:
          type: string
          minLength: 1
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - error
      - code
      - message
      properties:
        error:
          type: string
          description: Stable machine-oriented slug
        code:
          type: string
          description: Stable machine-oriented code (Sentinel asserts this)
        message:
          type: string
          description: Human-readable explanation (not a secret)
      example:
        error: not implemented
        code: NOT_IMPLEMENTED
        message: 'this endpoint is not implemented'
    CreatePersonaRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
        instructions:
          type: string
          description: Rendered by the worker into a persona prefix. No secrets.
        mcpConnectorIds:
          type: array
          items:
            type: string
          description: Ids of MCP connectors already created for this tenant.
    Persona:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - instructions
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        instructions:
          type: string
        mcpConnectorIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    PersonaList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Persona'
    McpHeaderRef:
      type: object
      additionalProperties: false
      required:
      - name
      - env
      properties:
        name:
          type: string
          description: HTTP header name. Not a secret value.
        env:
          type: string
          description: Environment variable name on the worker. Not a secret value.
    CreateMcpConnectorRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
        transport:
          type: string
          enum:
          - stdio
          - streamable_http
          default: stdio
          description: stdio starts a local command. streamable_http connects to url.
        command:
          type: string
          description: Executable used to start a stdio MCP server. Required for stdio. Not run by this API.
        args:
          type: array
          items:
            type: string
        envRefs:
          type: array
          items:
            type: string
          description: Environment variable names. Do not send values.
        url:
          type: string
          description: Remote MCP URL. Required for streamable_http. Public hosts must use https.
        headerRefs:
          type: array
          items:
            $ref: '#/components/schemas/McpHeaderRef'
        defaultOpen:
          type: boolean
          description: When true, the connector is on by default.
    McpConnector:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - transport
      - command
      - defaultOpen
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        transport:
          type: string
          enum:
          - stdio
          - streamable_http
        command:
          type: string
        args:
          type: array
          items:
            type: string
        envRefs:
          type: array
          items:
            type: string
        url:
          type: string
        headerRefs:
          type: array
          items:
            $ref: '#/components/schemas/McpHeaderRef'
        defaultOpen:
          type: boolean
        createdAt:
          type: string
          format: date-time
    McpConnectorList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/McpConnector'
