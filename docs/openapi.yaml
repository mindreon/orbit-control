openapi: 3.0.3
info:
  title: Orbit Control API
  version: 0.3.0
  description: |
    Orbit control API: the task center (TaskWorkflow), agent profiles, SOPs and policy, artifacts,
    and the tenant catalog (assistants, connectors, skills, MCP market). Tasks are stored in Postgres
    (`ORBIT_CONTROL_DB_URL`); control drives TaskWorkflow through Temporal (`TEMPORAL_ADDRESS`). The
    event stream of a task is SSE with a durable per-task `seq` and ephemeral live frames without one.

    The agent loop runs on orbit-worker (AgentScope). This API never exposes Temporal or worker URLs.

    `Unauthorized` (401) and `Forbidden` (403) are reserved shapes for the auth layer.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://127.0.0.1:8080
  description: Local control
security: []
tags:
- name: health
  description: Liveness
- name: tasks
  description: TaskWorkflow orchestration
- name: profiles
  description: Immutable versioned agent profiles
- name: policy
  description: Tenant policy layer (tighten-only)
- name: sops
  description: Versioned SOP definitions
- name: personas
  description: Agent personas. Stored in Postgres when ORBIT_CONTROL_DB_URL is set.
- name: mcp-connectors
  description: MCP connector launchers. Environment references are names only.
- name: mcp-market
  description: |
    Shared ModelScope plaza snapshot stored in this service. Listing reads
    the local copy. Process start loads the shipped snapshot. This API does
    not call modelscope.cn, does not store launch commands or hosted URLs,
    and does not connect to a server.
- name: skills
  description: |
    Shared SkillHub catalog stored in this service. Listing reads the local
    copy. A background sync refreshes it. Skill packages are not downloaded
    and this API does not install them.
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: Health check
      description: 'Returns 200 `{status: ok}` without touching the database.'
      x-unimplemented: false
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/personas:
    get:
      tags:
      - personas
      operationId: listPersonas
      summary: List personas
      x-unimplemented: false
      responses:
        '200':
          description: Personas for the caller's tenant, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - personas
      operationId: createPersona
      summary: Create a persona
      description: |
        Stored for the caller's tenant. The worker renders instructions into
        an agent preset at openSession. This API never accepts secret plaintext.
      x-unimplemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonaRequest'
      responses:
        '200':
          description: Created persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          description: Missing name, or a connector id that includes a value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mcp-connectors:
    get:
      tags:
      - mcp-connectors
      operationId: listMcpConnectors
      summary: List MCP connectors
      x-unimplemented: false
      responses:
        '200':
          description: Connectors for the caller's tenant, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnectorList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - mcp-connectors
      operationId: createMcpConnector
      summary: Create an MCP connector
      description: |
        Stores how to reach an MCP server. `stdio` keeps a launch command.
        `streamable_http` keeps a URL. `envRefs` and `headerRefs` are names.
        Values are rejected. This API does not run the connector.
      x-unimplemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMcpConnectorRequest'
      responses:
        '200':
          description: Created connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnector'
        '400':
          description: Missing name or launch target, or a name that includes a value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mcp-market:
    get:
      tags:
      - mcp-market
      operationId: listMcpMarket
      summary: List the stored ModelScope MCP plaza
      description: |
        Reads the plaza snapshot stored by this service. The handler does not
        call modelscope.cn. Rows are display metadata only.
      x-unimplemented: false
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: serviceType
        in: query
        schema:
          type: string
          enum:
          - hosted
          - local
      - name: needsOnline
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 48
      responses:
        '200':
          description: One page of the stored plaza. items is empty until startup stores the snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpMarketList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mcp-market/{id}:
    get:
      tags:
      - mcp-market
      operationId: getMcpMarket
      summary: Read one stored MCP server
      description: |
        Reads one plaza server and its readme and tool list from this service.
        The handler does not call modelscope.cn. Hosted connection URLs and
        discussion threads are not stored.
      x-unimplemented: false
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored server. readme and tools may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpMarketDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No stored server has this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/mcp-market-categories:
    get:
      tags:
      - mcp-market
      operationId: listMcpMarketCategories
      summary: List stored plaza categories
      description: |
        Reads category labels stored with the plaza snapshot. Counts follow
        the needsOnline filter. Does not call modelscope.cn.
      x-unimplemented: false
      parameters:
      - name: needsOnline
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Category labels that have at least one stored server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpMarketCategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skills:
    get:
      tags:
      - skills
      operationId: listSkills
      summary: List the local SkillHub catalog
      description: |
        Reads the catalog stored by this service. The handler does not call
        SkillHub. A background sync copies public skill metadata (name,
        description, counts). Skill packages are not downloaded and this
        operation does not install a skill.
      x-unimplemented: false
      parameters:
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - score
          - downloads
          - updated_at
          - stars
          - trending
      - name: category
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
          enum:
          - clawhub
          - community
          - enterprise
      - name: keyword
        in: query
        schema:
          type: string
      - name: requiresApiKey
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: paid
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 48
      responses:
        '200':
          description: One page of the stored catalog. items is empty until the first sync writes rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skills/{handle}/{slug}:
    get:
      tags:
      - skills
      operationId: getSkill
      summary: Read one stored skill
      description: |
        Reads one row of the local catalog. The handler does not call
        SkillHub, and it does not download or install the skill package.
      x-unimplemented: false
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored skill. The description is the saved summary, not a package file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '404':
          description: No stored row matches this handle and slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skills/{slug}:
    get:
      tags:
      - skills
      operationId: getSkillBySlug
      summary: Read one stored skill that has no author handle
      description: |
        Reads one row whose id is the slug alone. The handler does not call
        SkillHub, and it does not download or install the skill package.
      x-unimplemented: false
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored skill.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '404':
          description: No stored row matches this slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skill-files/{handle}/{slug}:
    get:
      tags:
      - skills
      operationId: listSkillFiles
      summary: Read text files saved for one skill
      description: |
        Returns text copied once from the public package so the page can show
        it, plus meta when the extra public page fields have been copied.
        The first call may read SkillHub. A saved copy that is missing a listed
        text file, including one under a subdirectory, is read once more.
        A failed copy is not remembered, so the next open tries again.
        Later calls read the stored copy.
        The files are not installed or executed, and this response is not a zip.
        meta omits signed report URLs.
      x-unimplemented: false
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Saved text files. items is empty when the package had none we keep.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillTextFileList'
        '404':
          description: No stored skill matches this handle and slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skill-files/{slug}:
    get:
      tags:
      - skills
      operationId: listSkillFilesBySlug
      summary: Read text files for a skill that has no author handle
      description: |
        Same as listSkillFiles, for a row whose id is the slug alone.
      x-unimplemented: false
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Saved text files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillTextFileList'
        '404':
          description: No stored skill matches this slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skill-categories:
    get:
      tags:
      - skills
      operationId: listSkillCategories
      summary: List stored skill category labels
      description: Reads labels stored with the local catalog. Does not call SkillHub.
      x-unimplemented: false
      responses:
        '200':
          description: Category labels, ordered by sortOrder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tasks:
    get:
      tags:
      - tasks
      operationId: listTasks
      summary: List task workflows
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      tags:
      - tasks
      operationId: createTask
      summary: Create and start a TaskWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /v1/profiles:
    get:
      tags:
      - profiles
      operationId: listProfiles
      responses:
        '200':
          description: Immutable profile versions
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
    post:
      tags:
      - profiles
      operationId: registerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProfileRequest'
      responses:
        '201':
          description: Profile registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
  /v1/profiles/{profileRef}:
    get:
      tags:
      - profiles
      operationId: getProfile
      parameters:
      - name: profileRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Immutable profile version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
  /v1/policy:
    get:
      tags:
      - policy
      operationId: getTenantPolicy
      responses:
        '200':
          description: The tenant-wide policy, the outermost layer (05 §6)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
    put:
      tags:
      - policy
      operationId: setTenantPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200':
          description: The policy now in force. Tasks and profiles can only tighten it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
  /v1/sops:
    get:
      tags:
      - sops
      operationId: listSOPs
      responses:
        '200':
          description: Immutable SOP versions
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SOP'
    post:
      tags:
      - sops
      operationId: registerSOP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSOPRequest'
      responses:
        '201':
          description: SOP registered (the same id, version and steps again is a no-op)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOP'
        '409':
          description: The version exists with different steps
  /v1/tasks/{taskId}:
    parameters:
    - name: taskId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - tasks
      operationId: getTask
      responses:
        '200':
          description: Task projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /v1/tasks/{taskId}/messages:
    post:
      tags:
      - tasks
      operationId: sendTaskMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTaskMessageRequest'
      responses:
        '202':
          description: Update accepted, or the stored response of an earlier request with the same command_id (replay)
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED: the command_id was already used with a different request body or for a different
            command. IN_PROGRESS: another request with the same command_id and body is still being processed (the
            response has Retry-After: 1); retry with the same command_id. The server does not wait for it. A command
            whose orchestrator call failed can be retried with the same command_id; the record is kept in
            idempotency_ledger (scope api_command), so this holds across replicas and restarts.
  /v1/tasks/{taskId}/control:
    post:
      tags:
      - tasks
      operationId: controlTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskControlRequest'
      responses:
        '202':
          description: Update accepted, or the stored response of an earlier request with the same command_id (replay)
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED: the command_id was already used with a different request body or for a different
            command. IN_PROGRESS: another request with the same command_id and body is still being processed (the
            response has Retry-After: 1); retry with the same command_id. The server does not wait for it. A command
            whose orchestrator call failed can be retried with the same command_id; the record is kept in
            idempotency_ledger (scope api_command), so this holds across replicas and restarts.
  /v1/tasks/{taskId}/budget:
    post:
      tags:
      - tasks
      operationId: grantTaskBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantBudgetRequest'
      responses:
        '202':
          description: Update accepted, or the stored response of an earlier request with the same command_id (replay)
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED: the command_id was already used with a different request body or for a different
            command. IN_PROGRESS: another request with the same command_id and body is still being processed (the
            response has Retry-After: 1); retry with the same command_id. The server does not wait for it. A command
            whose orchestrator call failed can be retried with the same command_id; the record is kept in
            idempotency_ledger (scope api_command), so this holds across replicas and restarts.
  /v1/tasks/{taskId}/profile:
    post:
      tags:
      - tasks
      operationId: requestTaskProfileSwitch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestProfileSwitchRequest'
      responses:
        '202':
          description: Update accepted, or the stored response of an earlier request with the same command_id (replay)
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED: the command_id was already used with a different request body or for a different
            command. IN_PROGRESS: another request with the same command_id and body is still being processed (the
            response has Retry-After: 1); retry with the same command_id. The server does not wait for it. A command
            whose orchestrator call failed can be retried with the same command_id; the record is kept in
            idempotency_ledger (scope api_command), so this holds across replicas and restarts.
  /v1/tasks/{taskId}/approvals/{approvalId}:
    post:
      tags:
      - tasks
      operationId: decideTaskApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTaskApprovalRequest'
      responses:
        '202':
          description: Update accepted, or the stored response of an earlier request with the same command_id (replay)
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED: the command_id was already used with a different request body or for a different
            command. IN_PROGRESS: another request with the same command_id and body is still being processed (the
            response has Retry-After: 1); retry with the same command_id. The server does not wait for it. A command
            whose orchestrator call failed can be retried with the same command_id; the record is kept in
            idempotency_ledger (scope api_command), so this holds across replicas and restarts.
  /v1/tasks/{taskId}/plan:
    post:
      tags:
      - tasks
      operationId: submitPlanChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Update accepted, or the stored response of an earlier request with the same command_id (replay)
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED: the command_id was already used with a different request body or for a different
            command. IN_PROGRESS: another request with the same command_id and body is still being processed (the
            response has Retry-After: 1); retry with the same command_id. The server does not wait for it. A command
            whose orchestrator call failed can be retried with the same command_id; the record is kept in
            idempotency_ledger (scope api_command), so this holds across replicas and restarts.
    get:
      tags:
      - tasks
      operationId: getTaskPlan
      responses:
        '200':
          description: Current plan
          content:
            application/json:
              schema:
                type: object
  /v1/tasks/{taskId}/events:
    get:
      tags:
      - tasks
      operationId: streamTaskEvents
      summary: Durable and ephemeral task events
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/tasks/{taskId}/artifacts:
    get:
      tags:
      - tasks
      operationId: listTaskArtifacts
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Artifact manifests emitted by the task
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtifactManifest'
  /v1/artifacts/{manifestId}:
    get:
      tags:
      - tasks
      operationId: getArtifactManifest
      parameters:
      - name: manifestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Artifact manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactManifest'
  /v1/artifacts/{manifestId}/url:
    get:
      tags:
      - tasks
      operationId: getArtifactDownloadURL
      parameters:
      - name: manifestId
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Short lived tenant scoped presigned artifact URL
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                properties:
                  url:
                    type: string
                    format: uri
components:
  schemas:
    Task:
      type: object
      required:
      - task_id
      - tenant_id
      - workflow_id
      - title
      - goal
      - mode
      - status
      - profile
      - plan_version
      properties:
        task_id:
          type: string
          pattern: ^task_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        tenant_id:
          type: string
        workflow_id:
          type: string
        title:
          type: string
        goal:
          type: string
        mode:
          type: string
          enum:
          - single
          - multi
          - long
        status:
          type: string
        profile:
          type: string
        plan_version:
          type: integer
          minimum: 1
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        budgets:
          type: object
          additionalProperties: true
        usage:
          type: object
          additionalProperties: true
        pending_approvals:
          type: array
          items:
            type: string
        policy:
          $ref: '#/components/schemas/Policy'
    Profile:
      type: object
      required:
      - profile_id
      - version
      - ref
      - spec
      - created_at
      properties:
        profile_id:
          type: string
        version:
          type: integer
          minimum: 1
        ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*@[1-9][0-9]*$
        spec:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    RegisterProfileRequest:
      type: object
      required:
      - profile_id
      - version
      - spec
      properties:
        profile_id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        spec:
          type: object
          additionalProperties: true
    Policy:
      type: object
      description: What an attempt may do. Tenant, task and profile layers only tighten each other.
      properties:
        denied_tools:
          type: array
          items:
            type: string
            minLength: 1
        exploration_max_tool_calls:
          type: integer
          minimum: 0
    SOP:
      type: object
      required:
      - sop_id
      - version
      - ref
      - steps
      - created_at
      properties:
        sop_id:
          type: string
        version:
          type: integer
          minimum: 1
        ref:
          type: string
          description: sop_id@version, what a sop_stage node names
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SOPStep'
        created_at:
          type: string
          format: date-time
    RegisterSOPRequest:
      type: object
      required:
      - sop_id
      - version
      - steps
      properties:
        sop_id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        steps:
          type: array
          minItems: 1
          description: A step is an object, or a bare string standing for a step whose subject and description are
            that text.
          items:
            oneOf:
            - type: string
              minLength: 1
            - $ref: '#/components/schemas/SOPStep'
    SOPStep:
      type: object
      required:
      - subject
      properties:
        subject:
          type: string
          minLength: 1
        description:
          type: string
          description: What the step must achieve; defaults to the subject
        max_attempts:
          type: integer
          minimum: 1
          description: Refusals before the SOP gives up on the step; defaults to 3
    ArtifactManifest:
      type: object
      required:
      - manifest_id
      - task_id
      - entries
      - created_at
      properties:
        manifest_id:
          type: string
        task_id:
          type: string
        attempt_id:
          type: string
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
        manifest_hash:
          type: string
        created_at:
          type: string
          format: date-time
    CreateTaskRequest:
      type: object
      required:
      - title
      - goal
      properties:
        title:
          type: string
          minLength: 1
        goal:
          type: string
          minLength: 1
        mode:
          type: string
          enum:
          - single
          - multi
          - long
          default: single
        profile:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*@[1-9][0-9]*$
        sop:
          type: string
        budgets:
          type: object
          additionalProperties: true
        policy:
          $ref: '#/components/schemas/Policy'
          description: 'The task layer of the policy: it can only tighten the tenant layer.'
    SendTaskMessageRequest:
      type: object
      required:
      - text
      properties:
        command_id:
          type: string
        client_message_id:
          type: string
        text:
          type: string
          minLength: 1
        delivery:
          type: string
          enum:
          - queue
          - interrupt
          default: queue
    TaskControlRequest:
      type: object
      required:
      - action
      properties:
        command_id:
          type: string
        action:
          type: string
          enum:
          - pause
          - resume
          - cancel
          - takeover
          - handback
        reason:
          type: string
    DecideTaskApprovalRequest:
      type: object
      required:
      - decision
      properties:
        command_id:
          type: string
        decision:
          type: string
          enum:
          - approve
          - reject
        comment:
          type: string
    GrantBudgetRequest:
      type: object
      required:
      - delta
      properties:
        command_id:
          type: string
        delta:
          type: object
          additionalProperties: true
    RequestProfileSwitchRequest:
      type: object
      required:
      - node_id
      - to_profile
      - reason
      properties:
        command_id:
          type: string
        node_id:
          type: string
        to_profile:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*@[1-9][0-9]*$
        reason:
          type: string
          minLength: 1
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - error
      - code
      - message
      properties:
        error:
          type: string
          description: Stable machine-oriented slug
        code:
          type: string
          description: Stable machine-oriented code (Sentinel asserts this)
        message:
          type: string
          description: Human-readable explanation (not a secret)
      example:
        error: not implemented
        code: NOT_IMPLEMENTED
        message: 'this endpoint is not implemented'
    CreatePersonaRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
        instructions:
          type: string
          description: Rendered by the worker into a persona prefix. No secrets.
        mcpConnectorIds:
          type: array
          items:
            type: string
          description: Ids of MCP connectors already created for this tenant.
    Persona:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - instructions
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        instructions:
          type: string
        mcpConnectorIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    PersonaList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Persona'
    McpHeaderRef:
      type: object
      additionalProperties: false
      required:
      - name
      - env
      properties:
        name:
          type: string
          description: HTTP header name. Not a secret value.
        env:
          type: string
          description: Environment variable name on the worker. Not a secret value.
    CreateMcpConnectorRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
        transport:
          type: string
          enum:
          - stdio
          - streamable_http
          default: stdio
          description: stdio starts a local command. streamable_http connects to url.
        command:
          type: string
          description: Executable used to start a stdio MCP server. Required for stdio. Not run by this API.
        args:
          type: array
          items:
            type: string
        envRefs:
          type: array
          items:
            type: string
          description: Environment variable names. Do not send values.
        url:
          type: string
          description: Remote MCP URL. Required for streamable_http. Public hosts must use https.
        headerRefs:
          type: array
          items:
            $ref: '#/components/schemas/McpHeaderRef'
        defaultOpen:
          type: boolean
          description: When true, the connector is on by default.
    McpConnector:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - transport
      - command
      - defaultOpen
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        transport:
          type: string
          enum:
          - stdio
          - streamable_http
        command:
          type: string
        args:
          type: array
          items:
            type: string
        envRefs:
          type: array
          items:
            type: string
        url:
          type: string
        headerRefs:
          type: array
          items:
            $ref: '#/components/schemas/McpHeaderRef'
        defaultOpen:
          type: boolean
        createdAt:
          type: string
          format: date-time
    McpConnectorList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/McpConnector'
    McpMarketServer:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - summary
      - author
      - category
      - categoryName
      - categoryMore
      - calls
      - views
      - stars
      - verified
      - hosted
      - needsOnline
      properties:
        id:
