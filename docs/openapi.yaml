  /v1/runs/{r}/events:
    x-served-by: stream-gateway
    get:
      operationId: streamRunsEvents
      summary: Subscribe to runs events
      description: |
        SSE frames contain id (JetStream stream sequence), event (RunEvent.type),
        and data (the original single-line RunEvent JSON). Starts with retry: 1000;
        idle heartbeats are comments. Run streams send event: end with data
        {"reason":"run_finished"} only when a terminal event is known and the
        consumer is caught up (NumPending is zero), then close after 500ms.
        Terminal knowledge comes from run.completed/run.failed on this connection
        (even if filtered), or a DeliverLast lookup of the run's end marker when
        Last-Event-ID is positive. Already queued late events precede end;
        no more frames are queued afterward. Marker lookup failure returns 503.
        Session streams silently skip marker subjects and never send end.
        Last-Event-ID 0 means DeliverAll; positive cursors resume after that sequence.
        Expired tokens close silently. Query token is a fallback; Bearer takes precedence.
      security: []
      parameters:
        - name: r
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/EventTypes'
        - $ref: '#/components/parameters/EventExclude'
        - name: Last-Event-ID
          in: header
          schema: {type: string, pattern: '^[0-9]+$'}
        - name: Authorization
          in: header
          schema: {type: string}
        - name: token
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Ordered event stream
          content:
            text/event-stream:
              schema: {type: string}
        '400':
          description: INVALID_CURSOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: STREAM_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: EVENT_CURSOR_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: INVALID_FILTER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: "TOO_MANY_STREAMS (Retry-After: 5)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Stream unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/runs/{r}/history:
    get:
      operationId: getRunsHistory
      summary: Read persisted runs events
      description: |
        Requires session.read. Ordered by stream_seq; excludes transient events.
        Sink projection may lag. Reconnect SSE with resume_from to catch up.
        The response is bounded by the sink safety floor B; a non-final page sets
        next_cursor and resume_from to its last returned sequence. A final page,
        including an empty or filtered page, sets resume_from to max(after, B).
        If the safety floor is unavailable, the endpoint returns 503 STREAM_UNAVAILABLE
        with retryable true.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: r
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: after
          in: query
          schema: {type: string, pattern: '^[0-9]+$', default: '0'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
        - $ref: '#/components/parameters/EventTypes'
        - $ref: '#/components/parameters/EventExclude'
      responses:
        '200':
          description: Persisted event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventPage'
        '400':
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session or run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: INVALID_FILTER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: STREAM_UNAVAILABLE (no cached safety floor); retryable is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{s}/events:
    x-served-by: stream-gateway
