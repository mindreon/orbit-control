openapi: 3.0.3
info:
  title: Orbit Control API
  version: 0.1.0-w1
  description: |
    W1 **live rooms**. Health, rooms, messages, approvals, and SSE events are
    implemented in-memory. Control calls orbit-worker HTTP activities; it still
    has no database, OAuth, or Temporal client.

    Product surfaces:

    - **Super single-agent** — rooms `kind=solo` (W1)
    - **Multi-agent** — rooms `kind=collab`, per-room agent catalog (later)
    - **Cloud Agent** — `/v1/cloud-agents` jobs (later)

    The agent loop is hosted on orbit-worker as ACP (`dsh --profile acp` or the
    bundled mock ACP). This API never exposes dsh, Temporal, or worker URLs.

    `Unauthorized` (401) and `Forbidden` (403) are reserved shapes for later
    Sentinel tests. They are not emitted in W1.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local W1 control (in-memory rooms + HITL)
tags:
  - name: health
    description: Liveness
  - name: rooms
    description: Conversation / work rooms (W1 in-memory)
  - name: messages
    description: Room messages (W1 in-memory)
  - name: approvals
    description: Human-in-the-loop approvals (W1 in-memory)
  - name: personas
    description: Agent personas (unimplemented)
  - name: secrets
    description: Tenant secrets metadata only (unimplemented; plaintext never in API)
  - name: cloud-agents
    description: Cloud agent jobs (unimplemented)
  - name: websocket
    description: Public WebSocket upgrade (unimplemented)
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: W1 returns 200 `{status: ok}` without a database.
      x-unimplemented: false
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms
      x-unimplemented: false
      responses:
        "200":
          description: Room list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room
      description: |
        `kind=solo` is the super single-agent room. Opens an ACP session on
        orbit-worker (mock ACP by default). `kind=collab` is accepted but
        still one parent session in W1.
      x-unimplemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "200":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "502":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get a room
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/messages:
    get:
      tags: [messages]
      operationId: listRoomMessages
      summary: List messages in a room
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [messages]
      operationId: createRoomMessage
      summary: Post a message to a room
      description: Human turn text. Control calls worker `runTurn` (W1 stand-in for Temporal).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomMessageRequest"
      responses:
        "200":
          description: Room after the turn, plus a pending approval when parked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMessageResponse"
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/steer:
    post:
      tags: [rooms]
      operationId: steerRoom
      summary: Steer a running room (unimplemented)
      description: Maps to Temporal Signal `steer`. Legal only while the room is running.
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SteerRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/abort:
    post:
      tags: [rooms]
      operationId: abortRoom
      summary: Abort a room
      description: Calls worker `abort` (W1 stand-in for Temporal Signal `abort`).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortRequest"
      responses:
        "200":
          description: Room aborted
          content:
            application/json:
              schema:
                type: object
                required: [aborted]
                properties:
                  aborted:
                    type: boolean
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/events:
    get:
      tags: [rooms]
      operationId: streamRoomEvents
      summary: SSE room events
      description: |
        W1 stand-in for public WebSocket. orbit-web subscribes here only.
        Frames are `OrbitEvent` JSON (not raw ACP).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: text/event-stream of OrbitEvent JSON
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/agents:
    get:
      tags: [rooms]
      operationId: listRoomAgents
      summary: List agents in a room (unimplemented)
      description: |
        Parent session plus projected subagent catalog. Used by collab rooms
        and by solo rooms that spawned children.
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approvals
      x-unimplemented: false
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals/{approvalId}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Get an approval (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals/{approvalId}/decide:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject
      description: |
        Public HITL verb. Control maps `allow` to worker `resolveApproval`
        (`allowed-once`) then `runTurn` resume. `reject` maps to worker `abort`.
        Temporal Update/Signal is the later stand-in target.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/personas:
    get:
      tags: [personas]
      operationId: listPersonas
      summary: List personas (unimplemented)
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [personas]
      operationId: createPersona
      summary: Create a persona (unimplemented)
      description: |
        Stored here. The worker renders it into a dsh agent preset at
        openSession. This API never accepts secret plaintext inside a persona.
      x-unimplemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonaRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/personas/{personaId}:
    get:
      tags: [personas]
      operationId: getPersona
      summary: Get a persona (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/PersonaId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: List secret metadata (unimplemented)
      description: |
        Returns names and status only. Plaintext secret values are never
        included in request or response examples.
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [secrets]
      operationId: putSecret
      summary: Store a secret (unimplemented)
      description: Ciphertext is owned only by orbit-control. Body is a placeholder.
      x-unimplemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceholderObject"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/secrets/{secretId}:
    get:
      tags: [secrets]
      operationId: getSecretMetadata
      summary: Get secret metadata (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: Delete a secret (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents:
    get:
      tags: [cloud-agents]
      operationId: listCloudAgents
      summary: List cloud agent jobs (unimplemented)
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [cloud-agents]
      operationId: createCloudAgent
      summary: Start a cloud agent job (unimplemented)
      description: |
        Control starts Temporal workflow `CloudAgentJob`. GitHub and other
        webhooks also land here — not on dsh webhookRuntime.
      x-unimplemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCloudAgentRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents/{agentId}:
    get:
      tags: [cloud-agents]
      operationId: getCloudAgent
      summary: Get a cloud agent job (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents/{agentId}/cancel:
    post:
      tags: [cloud-agents]
      operationId: cancelCloudAgent
      summary: Cancel a cloud agent job (unimplemented)
      description: Maps to Temporal Signal `abort` on CloudAgentJob.
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /ws:
    get:
      tags: [websocket]
      operationId: upgradeWebSocket
      summary: Public WebSocket upgrade (unimplemented)
      description: |
        Placeholder for the public WS surface. orbit-web will subscribe here
        only — never to orch, worker, or dsh sockets.

        Later frames are `OrbitEvent` objects (session.status, assistant.message,
        tool.call, tool.result, approval.asked, agent.started, agent.finished,
        usage). Raw dsh/ACP payloads are not forwarded.
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
    PersonaId:
      name: personaId
      in: path
      required: true
      schema:
        type: string
    SecretId:
      name: secretId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error, code, message]
      properties:
        error:
          type: string
          description: Stable machine-oriented slug
        code:
          type: string
          description: Stable machine-oriented code (Sentinel asserts this)
        message:
          type: string
          description: Human-readable explanation (not a secret)
      example:
        error: not implemented
        code: NOT_IMPLEMENTED
        message: "W0 skeleton: this endpoint is not implemented"
    PlaceholderObject:
      type: object
      additionalProperties: true
      description: W0 request placeholder. No business fields yet.
    RoomKind:
      type: string
      enum: [solo, collab]
      description: solo = super single-agent; collab = multi-agent catalog in one room
    PermissionPreset:
      type: string
      enum: [workspace-write, danger-full-access]
      description: |
        Maps to dsh permission presets on the worker. Default workspace-write
        (sandbox workspace-write + approval ask). danger-full-access is explicit.
    RoomState:
      type: string
      enum: [idle, running, awaiting_approval, closed]
    Room:
      type: object
      additionalProperties: false
      required: [id, kind, title, state, createdAt]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/RoomKind"
        title:
          type: string
        state:
          $ref: "#/components/schemas/RoomState"
        sessionId:
          type: string
        createdAt:
          type: string
    RoomList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Room"
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, roomId, role, text, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        role:
          type: string
        type:
          type: string
        text:
          type: string
        createdAt:
          type: string
    MessageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    Approval:
      type: object
      additionalProperties: false
      required: [id, roomId, status, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        sessionId:
          type: string
        approvalRequestId:
          type: string
        toolName:
          type: string
        reason:
          type: string
        status:
          type: string
        decision:
          type: string
        createdAt:
          type: string
    ApprovalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    PostMessageResponse:
      type: object
      additionalProperties: false
      required: [room]
      properties:
        room:
          $ref: "#/components/schemas/Room"
        approval:
          $ref: "#/components/schemas/Approval"
    CloudAgentJobState:
      type: string
      enum: [queued, running, awaiting_approval, succeeded, failed, cancelled]
    CreateRoomRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/RoomKind"
        personaId:
          type: string
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
        title:
          type: string
    CreateRoomMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/TurnAttachment"
    TurnAttachment:
      type: object
      additionalProperties: false
      required: [name, contentType, urlOrBlobRef]
      properties:
        name:
          type: string
        contentType:
          type: string
        urlOrBlobRef:
          type: string
          description: Pointer only — not file bytes
    SteerRequest:
      type: object
      additionalProperties: false
      required: [instruction]
      properties:
        instruction:
          type: string
    AbortRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    DecideApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, reject]
          description: allow → allowed-once on the worker; reject → abort by default
    CreatePersonaRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        instructions:
          type: string
          description: Rendered by the worker into a dsh persona prefix. No secrets.
        mcpServerIds:
          type: array
          items:
            type: string
    CreateCloudAgentRequest:
      type: object
      additionalProperties: false
      required: [repoUrl, prompt]
      properties:
        repoUrl:
          type: string
        branch:
          type: string
        prompt:
          type: string
        personaId:
          type: string
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
    OrbitEvent:
      type: object
      additionalProperties: true
      required: [type]
      description: |
        Public WS envelope. Worker ingest must already be this shape — never
        raw ACP session/update.
      properties:
        type:
          type: string
          enum:
            - session.status
            - assistant.message
            - tool.call
            - tool.result
            - approval.asked
            - agent.started
            - agent.finished
            - usage
        roomId:
          type: string
        jobId:
          type: string
        sessionId:
          type: string
        turnId:
          type: string
  responses:
    NotImplemented:
      description: W0 skeleton — path is not implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: not implemented
            code: NOT_IMPLEMENTED
            message: "W0 skeleton: this endpoint is not implemented"
    Unauthorized:
      description: |
        Stub for later Sentinel tests. Missing or invalid credentials.
        W0 does not emit this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: unauthorized
            code: UNAUTHORIZED
            message: missing or invalid credentials
    Forbidden:
      description: |
        Stub for later Sentinel tests. Authenticated caller lacks permission.
        W0 does not emit this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: forbidden
            code: FORBIDDEN
            message: insufficient permissions
