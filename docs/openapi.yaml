          type: string
        handle:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        categoryName:
          type: string
        iconUrl:
          type: string
          description: Empty, or an https URL on an allowlisted image host.
        downloads:
          type: integer
        stars:
          type: integer
        source:
          type: string
        version:
          type: string
        requiresApiKey:
          type: boolean
        paid:
          type: boolean
        score:
          type: number
        updatedAt:
          type: string
          format: date-time
        trendingRank:
          type: integer
    SkillList:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - pageSize
      - syncedAt
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        syncedAt:
          type: string
          description: RFC3339 time of the newest stored row, or empty before the first sync.
    SkillCategory:
      type: object
      additionalProperties: false
      required:
      - key
      - name
      - nameEn
      - sortOrder
      properties:
        key:
          type: string
        name:
          type: string
        nameEn:
          type: string
        sortOrder:
          type: integer
    SkillCategoryList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SkillCategory'
    SkillTextFile:
      type: object
      additionalProperties: false
      required:
      - path
      - body
      properties:
        path:
          type: string
        body:
          type: string
