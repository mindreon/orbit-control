# Maintained by hand. internal/httpapi/openapi_test.go checks the route inventory.
openapi: 3.1.0
info:
  title: Orbit control API
  version: 2.0.0
  description: Identity, tenant administration, workspaces and audit for Orbit v2.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check process health
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
        default:
          $ref: '#/components/responses/Error'
  /ready:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL readiness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/config:
    get:
      operationId: getAuthConfig
      summary: Get the public OIDC or development login configuration
      security: []
      responses:
        '200':
          description: Browser login configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/dev/token:
    post:
      operationId: createDevToken
      summary: Sign in with the development issuer
      description: Available only in dev mode. A first login creates a personal tenant only when enabled.
      security: []
      parameters:
        - $ref: '#/components/parameters/OptionalTenant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevTokenInput'
      responses:
        '200':
          description: One-hour development access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevToken'
        default:
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated principal and tenant roles
      parameters:
        - $ref: '#/components/parameters/OptionalTenant'
      responses:
        '200':
          description: Current identity and memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants:
    get:
      operationId: listTenants
      summary: List active tenant memberships
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/workspaces:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      operationId: listWorkspaces
      summary: List readable workspaces
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspace page filtered by RBAC and API key scopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createWorkspace
      summary: Create a workspace and grant its creator ws.admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspace'
      responses:
        '201':
          $ref: '#/components/responses/Workspace'
        default:
          $ref: '#/components/responses/Error'
  /v1/workspaces/{w}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspace
      summary: Get a readable workspace
      description: Missing workspace.read returns 404, including for existing resources.
      responses:
        '200':
          $ref: '#/components/responses/Workspace'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateWorkspace
      summary: Update a workspace
      description: Unreadable resources return 404; readable resources without write permission return 403.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkspace'
      responses:
        '200':
          $ref: '#/components/responses/Workspace'
        default:
          $ref: '#/components/responses/Error'
  /v1/workspaces/{w}/members:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceMembers
      summary: List workspace members
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspace member page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addWorkspaceMember
      summary: Add an active tenant member to a workspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberInput'
      responses:
        '201':
          description: Membership and role granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberInput'
        default:
          $ref: '#/components/responses/Error'
  /v1/workspaces/{w}/members/{p}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PrincipalId'
    delete:
      operationId: removeWorkspaceMember
      summary: Remove a workspace member and their direct workspace roles
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/members:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      operationId: listMembers
      summary: List tenant members and direct tenant roles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant member page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addMember
      summary: Directly add an existing principal to the tenant
      description: The server sets source to direct. Granting tenant.owner requires tenant.manage.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInput'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/members/{p}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/PrincipalId'
    patch:
      operationId: updateMember
      summary: Update tenant membership status or replace direct tenant roles
      description: Owner changes require tenant.manage; the last active owner cannot be removed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatch'
      responses:
        '200':
          description: Updated membership fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPatchResult'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/api-keys:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      operationId: listApiKeys
      summary: List tenant API key metadata
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: API key page; plaintext keys are never listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createApiKey
      summary: Issue an API key for yourself or an authorized service principal
      description: >-
        Requires apikey.manage. Other human principals are forbidden. A different
        service principal requires tenant.manage. Scopes must be a subset of both
        issuer and recipient effective tenant permissions, including issuer API key
        scopes. Violations return 403. The plaintext key is returned only here.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyInput'
      responses:
        '201':
          description: Newly issued API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/api-keys/{k}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: k
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteApiKey
      summary: Revoke an API key
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/service-principals:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      operationId: listServicePrincipals
      summary: List service principals in the tenant
      description: Requires tenant.manage.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Service principal page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createServicePrincipal
      summary: Create a service principal and its initial tenant role
      description: Requires tenant.manage.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePrincipalInput'
      responses:
        '201':
          description: Created service principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/invitations:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      operationId: listInvitations
      summary: List tenant invitations without bearer tokens
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Invitation page; expiration is determined by expires_at
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createInvitation
      summary: Invite a verified email address into the tenant
      description: Requires member.manage, plus tenant.manage to invite an owner. Only a token hash is stored.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInput'
      responses:
        '201':
          description: Invitation with its one-time bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/invitations/{i}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: i
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Error'
  /v1/invitations/{token}:accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation using a matching verified email
      description: >-
        Requires a logged-in human user; API keys are forbidden. X-Orbit-Tenant is
        unnecessary. Email matching ignores case. Expired, revoked or already
        accepted tokens return 404 unless replaying the same Idempotency-Key.
        Existing memberships are never reactivated or escalated by invitations.
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, minLength: 43, maxLength: 43}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Active tenant membership created
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id]
                properties:
                  tenant_id: {type: string, format: uuid}
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/audit:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      operationId: listAuditEntries
      summary: List tenant audit entries and chain hashes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/assets:
    get:
      operationId: listAssets
      summary: List visible assets
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: kind
          in: query
          schema: {type: string}
        - name: visibility
          in: query
          schema: {type: string}
        - name: q
          in: query
          schema: {type: string}
        - name: workspace_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAsset
      summary: Register an asset
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}:
    get:
      operationId: getAsset
      summary: Read an asset
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchAsset
      summary: Change asset visibility
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetPatch" }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: archiveAsset
      summary: Archive an asset
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        '204':
          description: Successful operation
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/versions:
    post:
      operationId: uploadAssetVersion
      summary: Upload a ZIP or tar.gz immutable version
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: version
          in: query
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              additionalProperties: false
              properties:
                archive: {type: string, format: binary}
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetVersion" }
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listAssetVersions
      summary: List versions
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetVersionPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/versions/{v}:
    get:
      operationId: getAssetVersion
      summary: Read a version
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: v
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetVersion" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/versions/{v}/files:
    get:
      operationId: listAssetFiles
      summary: List files
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: v
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetFilePage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/versions/{v}/file:
    get:
      operationId: getAssetFile
      summary: Read one file (maximum 20 MiB)
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: v
          in: path
          required: true
          schema: {type: string}
        - name: path
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Successful operation
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/versions/{v}:submit:
    post:
      operationId: submitAssetVersion
      summary: Submit the immutable version for release
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: v
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAssetInput" }
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/versions/{v}:withdraw:
    post:
      operationId: withdrawAssetVersion
      summary: Withdraw a pending release
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: v
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/versions/{v}:transition:
    post:
      operationId: transitionAssetVersion
      summary: Deprecate, suspend, yank or restore a version
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: v
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionInput" }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetVersion" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/versions/{v}/checks:
    get:
      operationId: listAssetChecks
      summary: List checker reports
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: v
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/channels:
    get:
      operationId: listAssetChannels
      summary: List release channels
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}/channels/{c}:
    post:
      operationId: setAssetChannel
      summary: Set or roll back a channel
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - name: c
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        default:
          $ref: "#/components/responses/Error"
  /v1/assets/{a}:suspend:
    post:
      operationId: suspendAsset
      summary: Suspend an asset
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: a
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        default:
          $ref: "#/components/responses/Error"
