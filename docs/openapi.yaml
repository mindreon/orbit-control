      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTaskMessageRequest'
      responses:
        '202':
          description: Update accepted, or the stored response of an earlier request with the same command_id (replay)
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED: the command_id was already used with a different request body or for a different
            command. IN_PROGRESS: another request with the same command_id and body is still being processed (the
            response has Retry-After: 1); retry with the same command_id. The server does not wait for it. A command
            whose orchestrator call failed can be retried with the same command_id; the record is kept in
            idempotency_ledger (scope api_command), so this holds across replicas and restarts.
  /v1/tasks/{taskId}/control:
