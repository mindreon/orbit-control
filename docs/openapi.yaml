    SkillTextFileList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SkillTextFile'
        meta:
          $ref: '#/components/schemas/SkillPageMeta'
    SkillPageMeta:
      type: object
      additionalProperties: false
      description: |
        Public page fields copied once. Absent until that copy exists.
      properties:
        summary:
          type: string
        summaryZh:
          type: string
        subCategories:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - name
            properties:
              key:
                type: string
              name:
                type: string
        safe:
          type: boolean
        score:
          type: number
          description: AI score on a 0 to 5 scale, from the public evaluation.
        version:
          type: string
        updatedAt:
          type: integer
          description: Unix milliseconds.
        versionCreatedAt:
          type: integer
          description: Unix milliseconds.
        fileIndex:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - size
            properties:
              path:
                type: string
              size:
                type: integer
        versions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - version
            properties:
              version:
                type: string
              changelog:
                type: string
              createdAt:
                type: integer
        evaluation:
          type: object
          additionalProperties: false
          required:
          - score
          - dimensions
          properties:
            userSummary:
              type: string
            createdAt:
              type: integer
            score:
              type: number
            dimensions:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - key
                - label
                - labelZh
                - score
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  labelZh:
                    type: string
                  description:
                    type: string
                  score:
                    type: number
                  summary:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - key
                      - name
                      - score
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        score:
                          type: number
                        reason:
                          type: string
  responses:
    Unauthorized:
      description: |
        Stub for later Sentinel tests. Missing or invalid credentials.
        Reserved for the auth layer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: unauthorized
            code: UNAUTHORIZED
            message: missing or invalid credentials
    Forbidden:
      description: |
        Stub for later Sentinel tests. Authenticated caller lacks permission.
        Reserved for the auth layer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: forbidden
            code: FORBIDDEN
            message: insufficient permissions
