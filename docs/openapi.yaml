openapi: 3.0.3
info:
  title: Orbit Control API
  version: 0.2.0-w1
  description: |
    W1 **live rooms**. Health, rooms, messages, approvals, room activity history,
    steer, and SSE events are implemented. Rooms, messages, approvals and
    idempotency keys are stored in Postgres when `ORBIT_CONTROL_DB_URL` is set
    (in-memory otherwise, dev/test only); activity and SSE are still
    in-process. Control calls orbit-worker HTTP activities directly, or
    RoomWorkflow when Temporal is configured. It still has no OAuth.

    Product surfaces:

    - **Super single-agent** — rooms `kind=solo` (W1)
    - **Multi-agent** — rooms `kind=collab`, per-room agent catalog (later)
    - **Cloud Agent** — `/v1/cloud-agents` jobs (later)

    The agent loop runs on orbit-worker as AgentScope. This API does not
    require `kernel=dsh` or `protocol=acp`, and it never exposes Temporal
    or worker URLs.

    `Unauthorized` (401) and `Forbidden` (403) are reserved shapes for later
    Sentinel tests. They are not emitted in W1.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local W1 control (in-memory rooms + HITL)
# W1 intentionally has no authentication. Later security schemes replace this
# root-level declaration; the reserved 401/403 response bodies stay stable.
security: []
tags:
  - name: health
    description: Liveness
  - name: rooms
    description: Conversation / work rooms (W1 in-memory)
  - name: messages
    description: Room messages (W1 in-memory)
  - name: approvals
    description: Human-in-the-loop approvals (W1 in-memory)
  - name: personas
    description: Agent personas (W2 in-memory catalog)
  - name: secrets
    description: Tenant secrets metadata only (unimplemented; plaintext never in API)
  - name: cloud-agents
    description: Cloud agent jobs (unimplemented)
  - name: websocket
    description: Public WebSocket upgrade (unimplemented)
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: "W1 returns 200 `{status: ok}` without a database."
      x-unimplemented: false
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms
      x-unimplemented: false
      responses:
        "200":
          description: Room list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room
      description: |
        `kind=solo` is the super single-agent room. Opens a session on
        orbit-worker. `permissionPreset` is pinned on that room and forwarded
        with the session (`workspace-write`, `read-only`, or
        `danger-full-access`). `danger-full-access` applies only to this
        room, not as a global client switch. `kind=collab` is accepted but
        still one parent session in W1.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "200":
          description: |
            Created room, or the original room when the same
            `Idempotency-Key` and body are replayed.
          headers:
            Idempotent-Replayed:
              description: "`true` when this response is a replay."
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: |
            The `Idempotency-Key` belongs to a room that was deleted. The body
            is identical to a missing room and never contains its id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: not found
                code: NOT_FOUND
                message: room not found
        "409":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "502":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get a room
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: Soft-delete a room (task)
      description: |
        Only the creator may delete. Checks run in order: unauthenticated →
        401, CSRF (`Origin` not allowed or `X-Orbit-Request: 1` missing) →
        403, not the creator / missing / already deleted → 404.

        Control first sends `abort` to the room workflow, then marks the room
        deleted. If the abort fails or times out, the room is still deleted
        and 204 is returned. Open SSE streams for the room are closed; the
        room, its messages, activity, events and approvals then return 404.
        Any request body is ignored; `deleted_at` / `deleted_by` are set by
        the server from the session. There is no restore or purge API.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: Room deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/rooms/{roomId}/messages:
    get:
      tags: [messages]
      operationId: listRoomMessages
      summary: List messages in a room
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [messages]
      operationId: createRoomMessage
      summary: Post a message to a room
      description: Human turn text. Control calls worker `runTurn` (W1 stand-in for Temporal).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomMessageRequest"
      responses:
        "200":
          description: Room after the turn, plus a pending approval when parked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMessageResponse"
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/steer:
    post:
      tags: [rooms]
      operationId: steerRoom
      summary: Steer a running room
      description: |
        Maps to Temporal Signal `steer`, or the worker Activity on the direct
        W1 path. Legal only while the room is running.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SteerRequest"
      responses:
        "200":
          description: Steer accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/abort:
    post:
      tags: [rooms]
      operationId: abortRoom
      summary: Abort a room
      description: Calls worker `abort` (W1 stand-in for Temporal Signal `abort`).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortRequest"
      responses:
        "200":
          description: Room aborted
          content:
            application/json:
              schema:
                type: object
                required: [aborted]
                properties:
                  aborted:
                    type: boolean
        "400":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/events:
    get:
      tags: [rooms]
      operationId: streamRoomEvents
      summary: SSE room events
      description: |
        W1 stand-in for public WebSocket. orbit-web subscribes here only.
        Frames are normalized `ActivityEvent` JSON (not raw ACP).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: text/event-stream of ActivityEvent JSON
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/activity:
    get:
      tags: [rooms]
      operationId: listRoomActivity
      summary: List the room execution timeline
      description: |
        Returns a bounded, ordered history of normalized Orbit events. The
        response never contains raw dsh or ACP frames.
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room activity, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEventList"
        "404":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rooms/{roomId}/agents:
    get:
      tags: [rooms]
      operationId: listRoomAgents
      summary: List agents in a room (unimplemented)
      description: |
        Parent session plus projected subagent catalog. Used by collab rooms
        and by solo rooms that spawned children.
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approvals
      x-unimplemented: false
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals/{approvalId}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Get an approval (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/approvals/{approvalId}/decide:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject
      description: |
        Public HITL verb. Control maps `allow` to worker `resolveApproval`
        (`allowed-once`) then `runTurn` resume. `reject` maps to worker `abort`.
        Temporal Update/Signal is the later stand-in target.

        The approval is claimed with a conditional update (`status = pending`)
        before anything is sent to the workflow, so concurrent decisions have
        exactly one winner and the workflow receives exactly one decision.
        Deciding an approval that is no longer pending returns **409**
        `APPROVAL_NOT_PENDING` (contract §2.0; previously 400). If delivering
        the decision fails or times out, the response is **502**
        `DECISION_DELIVERY_FAILED` and the approval stays decided (no
        automatic retry, no reopen in phase 1).
      x-unimplemented: false
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          description: |
            The decision was delivered, but resuming the turn afterwards
            failed. The message carries the worker error. The approval stays
            decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: bad request
                code: BAD_REQUEST
                message: "worker runTurn: HTTP 500"
        "404":
          description: Missing, not owned by the caller, in another tenant, or its task was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: not found
                code: NOT_FOUND
                message: approval not found
        "409":
          $ref: "#/components/responses/ApprovalNotPending"
        "502":
          $ref: "#/components/responses/DecisionDeliveryFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/personas:
    get:
      tags: [personas]
      operationId: listPersonas
      summary: List personas
      x-unimplemented: false
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [personas]
      operationId: createPersona
      summary: Create a persona (unimplemented)
      description: |
        Stored here. The worker renders it into a dsh agent preset at
        openSession. This API never accepts secret plaintext inside a persona.
      x-unimplemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonaRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/personas/{personaId}:
    get:
      tags: [personas]
      operationId: getPersona
      summary: Get a persona (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/PersonaId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: List secret metadata (unimplemented)
      description: |
        Returns names and status only. Plaintext secret values are never
        included in request or response examples.
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [secrets]
      operationId: putSecret
      summary: Store a secret (unimplemented)
      description: Ciphertext is owned only by orbit-control. Body is a placeholder.
      x-unimplemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceholderObject"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/secrets/{secretId}:
    get:
      tags: [secrets]
      operationId: getSecretMetadata
      summary: Get secret metadata (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: Delete a secret (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents:
    get:
      tags: [cloud-agents]
      operationId: listCloudAgents
      summary: List cloud agent jobs (unimplemented)
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [cloud-agents]
      operationId: createCloudAgent
      summary: Start a cloud agent job (unimplemented)
      description: |
        Control starts Temporal workflow `CloudAgentJob`. GitHub and other
        webhooks also land here — not on dsh webhookRuntime.
      x-unimplemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCloudAgentRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents/{agentId}:
    get:
      tags: [cloud-agents]
      operationId: getCloudAgent
      summary: Get a cloud agent job (unimplemented)
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/cloud-agents/{agentId}/cancel:
    post:
      tags: [cloud-agents]
      operationId: cancelCloudAgent
      summary: Cancel a cloud agent job (unimplemented)
      description: Maps to Temporal Signal `abort` on CloudAgentJob.
      x-unimplemented: true
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /ws:
    get:
      tags: [websocket]
      operationId: upgradeWebSocket
      summary: Public WebSocket upgrade (unimplemented)
      description: |
        Placeholder for the public WS surface. orbit-web will subscribe here
        only — never to orch, worker, or dsh sockets.

        Later frames are `OrbitEvent` objects (session.status, assistant.message,
        tool.call, tool.result, approval.asked, agent.started, agent.finished,
        usage). Raw dsh/ACP payloads are not forwarded.
      x-unimplemented: true
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional, at most 128 characters. Scoped to the calling user and
        kept for 24 hours; only its sha256 is stored.
      schema:
        type: string
        maxLength: 128
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
    PersonaId:
      name: personaId
      in: path
      required: true
      schema:
        type: string
    SecretId:
      name: secretId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error, code, message]
      properties:
        error:
          type: string
          description: Stable machine-oriented slug
        code:
          type: string
          description: Stable machine-oriented code (Sentinel asserts this)
        message:
          type: string
          description: Human-readable explanation (not a secret)
      example:
        error: not implemented
        code: NOT_IMPLEMENTED
        message: "W0 skeleton: this endpoint is not implemented"
    PlaceholderObject:
      type: object
      additionalProperties: true
      description: W0 request placeholder. No business fields yet.
    RoomKind:
      type: string
      enum: [solo, collab]
      description: solo = super single-agent; collab = multi-agent catalog in one room
    PermissionPreset:
      type: string
      enum: [workspace-write, read-only, danger-full-access]
      description: |
        Closed presets the AgentScope worker already accepts. Default is
        `workspace-write`. `read-only` is explore-only. `danger-full-access`
        is explicit and applies only to the room or cloud-agent job that
        sets it — not a global client switch.
    RoomState:
      type: string
      enum: [idle, running, awaiting_approval, closed]
    Room:
      type: object
      additionalProperties: false
      required: [id, kind, title, state, permissionPreset, runtime, createdAt]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/RoomKind"
        title:
          type: string
        state:
          $ref: "#/components/schemas/RoomState"
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
        runtime:
          $ref: "#/components/schemas/RuntimeSnapshot"
        sessionId:
          type: string
        createdAt:
          type: string
    RuntimeSnapshot:
      type: object
      additionalProperties: false
      required: [kernel, protocol, isolation]
      properties:
        kernel:
          type: string
          description: |
            Runtime identity on the room snapshot. The live worker is
            `agentscope`. `dsh` is not required.
          example: agentscope
        protocol:
          type: string
          description: |
            Session protocol when the runtime has one. `acp` is not required.
            AgentScope rooms leave this empty; they do not speak ACP.
        isolation:
          type: string
          enum: [process]
          description: Per-session process isolation recorded on the room snapshot.
    RoomList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Room"
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, roomId, role, text, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        role:
          type: string
        type:
          type: string
        text:
          type: string
        createdAt:
          type: string
    MessageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    Approval:
      type: object
      additionalProperties: false
      required: [id, roomId, status, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        sessionId:
          type: string
        approvalRequestId:
          type: string
        toolName:
          type: string
        reason:
          type: string
        status:
          type: string
        decision:
          type: string
        createdAt:
          type: string
    ApprovalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [id, sequence, type, roomId, source, occurredAt]
      properties:
        id:
          type: string
        sequence:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - session.status
            - assistant.message
            - tool.call
            - tool.result
            - approval.asked
            - agent.started
            - agent.finished
            - usage
            - room.steered
        roomId:
          type: string
        sessionId:
          type: string
        turnId:
          type: string
        source:
          type: string
          enum: [control, worker]
        runtime:
          type: string
          description: |
            Runtime that produced the event. The AgentScope worker sends
            `agentscope`. `dsh` is not required.
          example: agentscope
        protocol:
          type: string
          description: Session protocol when present. `acp` is not required.
        role:
          type: string
        text:
          type: string
        toolName:
          type: string
        callId:
          type: string
        approvalId:
          type: string
        approvalRequestId:
          type: string
        reason:
          type: string
        status:
          type: string
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
        occurredAt:
          type: string
          format: date-time
    ActivityEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
    PostMessageResponse:
      type: object
      additionalProperties: false
      required: [room]
      properties:
        room:
          $ref: "#/components/schemas/Room"
        approval:
          $ref: "#/components/schemas/Approval"
    CloudAgentJobState:
      type: string
      enum: [queued, running, awaiting_approval, succeeded, failed, cancelled]
    CreateRoomRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/RoomKind"
        personaId:
          type: string
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
        title:
          type: string
    CreateRoomMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/TurnAttachment"
    TurnAttachment:
      type: object
      additionalProperties: false
      required: [name, contentType, urlOrBlobRef]
      properties:
        name:
          type: string
        contentType:
          type: string
        urlOrBlobRef:
          type: string
          description: Pointer only — not file bytes
    SteerRequest:
      type: object
      additionalProperties: false
      required: [instruction]
      properties:
        instruction:
          type: string
    AbortRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    DecideApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, reject]
          description: allow → allowed-once on the worker; reject → abort by default
    CreatePersonaRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        instructions:
          type: string
          description: Rendered by the worker into a dsh persona prefix. No secrets.
        mcpServerIds:
          type: array
          items:
            type: string
    CreateCloudAgentRequest:
      type: object
      additionalProperties: false
      required: [repoUrl, prompt]
      properties:
        repoUrl:
          type: string
        branch:
          type: string
        prompt:
          type: string
        personaId:
          type: string
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
    OrbitEvent:
      type: object
      additionalProperties: true
      required: [type]
      description: |
        Public WS envelope. Worker ingest must already be this shape — never
        raw ACP session/update.
      properties:
        type:
          type: string
          enum:
            - session.status
            - assistant.message
            - tool.call
            - tool.result
            - approval.asked
            - agent.started
            - agent.finished
            - usage
            - room.steered
        roomId:
          type: string
        jobId:
          type: string
        sessionId:
          type: string
        turnId:
          type: string
        eventId:
          type: string
        occurredAt:
          type: string
          format: date-time
        runtime:
          type: string
          description: |
            Runtime that produced the event. The AgentScope worker sends
            `agentscope`. `dsh` is not required.
          example: agentscope
        protocol:
          type: string
          description: Session protocol when present. `acp` is not required.
        permissionPreset:
          $ref: "#/components/schemas/PermissionPreset"
  responses:
    NotImplemented:
      description: W0 skeleton — path is not implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: not implemented
            code: NOT_IMPLEMENTED
            message: "W0 skeleton: this endpoint is not implemented"
    Unauthorized:
      description: |
        Stub for later Sentinel tests. Missing or invalid credentials.
        W0 does not emit this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: unauthorized
            code: UNAUTHORIZED
            message: missing or invalid credentials
    Forbidden:
      description: |
        Stub for later Sentinel tests. Authenticated caller lacks permission.
        W0 does not emit this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: forbidden
            code: FORBIDDEN
            message: insufficient permissions
    Unauthenticated:
      description: |
        No valid session (contract §17.6). Emitted before any storage lookup,
        so the body is identical on every path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: unauthenticated
            code: UNAUTHENTICATED
            message: authentication required
    CsrfRejected:
      description: |
        State-changing request without an allowed `Origin` and
        `X-Orbit-Request: 1` (contract §17.4).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: csrf rejected
            code: CSRF_REJECTED
            message: "state-changing requests need an allowed Origin and X-Orbit-Request: 1"
    NotFound:
      description: |
        Missing, not owned by the caller, in another tenant, or deleted.
        These cases share one body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: not found
            code: NOT_FOUND
            message: room not found
    ApprovalNotPending:
      description: The approval was already decided (or lost a concurrent decision).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: approval not pending
            code: APPROVAL_NOT_PENDING
            message: approval is not pending
    DecisionDeliveryFailed:
      description: |
        The decision is recorded, but delivering it to the workflow failed or
        exceeded the delivery timeout. The delivery call is `resolveApproval`
        on the direct worker path and the `decide` Update on the Temporal path.
        The approval stays decided and is not re-delivered; a resubmit returns
        409 `APPROVAL_NOT_PENDING`. The body is fixed and never includes
        worker or Temporal error text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: decision delivery failed
            code: DECISION_DELIVERY_FAILED
            message: the decision is recorded but its delivery to the workflow failed or timed out; it is not retried
    IdempotencyKeyReused:
      description: The `Idempotency-Key` was already used with a different body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: idempotency key reused
            code: IDEMPOTENCY_KEY_REUSED
            message: Idempotency-Key was already used with a different request body
