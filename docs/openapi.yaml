      - sortOrder
      - count
      properties:
        key:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
        count:
          type: integer
    McpMarketCategoryList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/McpMarketCategory'
    Skill:
      type: object
