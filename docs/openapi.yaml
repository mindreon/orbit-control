components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OIDC/dev JWT or orbit_ API key; selected tenant requires active membership.
  parameters:
    Tenant:
      name: X-Orbit-Tenant
      in: header
      required: true
      schema: {type: string, format: uuid}
    OptionalTenant:
      name: X-Orbit-Tenant
      in: header
      required: false
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
      description: Opaque cursor from the previous page; omit for the first page.
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {type: string, maxLength: 256}
      description: >-
        Optional 24-hour encrypted replay within a tenant. Reuse with different
        method, URI or body returns 422. Available for dev login when a tenant exists.
    WorkspaceId:
      name: w
      in: path
      required: true
      schema: {type: string, format: uuid}
    PrincipalId:
      name: p
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: >-
        Structured error. 400 invalid JSON/cursor/limit/tenant; 401 invalid credentials;
        403 forbidden; 404 absent or unreadable resource; 409 conflict; 413 body too
        large; 422 invalid input or idempotency mismatch; 500 transient internal failure;
        503 database unavailable. retryable indicates whether retrying may succeed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: Operation completed
    Health:
      description: Service is healthy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Workspace:
      description: Workspace representation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workspace'
  schemas:

    AssetInput:
      type: object
      additionalProperties: false
      required: [kind, name, visibility]
      properties:
        kind: {type: string, enum: [agent, skill, mcp_server, team]}
        name: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,63}$'}
        visibility: {type: string, enum: [private, workspace, tenant]}
        workspace_id: {type: string, format: uuid}
    AssetPatch:
      type: object
      additionalProperties: false
      required: [visibility]
      properties:
        visibility: {type: string, enum: [private, workspace, tenant]}
    Asset:
      type: object
      required: [id, publisher, kind, name, visibility, owner_id, status, created_at]
      properties:
        id: {type: string, format: uuid}
        publisher: {type: string}
        kind: {type: string, enum: [agent, skill, mcp_server, team]}
        name: {type: string}
        visibility: {type: string, enum: [private, workspace, tenant]}
        workspace_id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        status: {type: string, enum: [active, suspended, archived]}
        created_at: {type: string, format: date-time}
    AssetVersion:
      type: object
      required: [id, asset_id, version, manifest, content_digest, permissions, state, created_at]
      properties:
        id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        version: {type: string}
        manifest: {type: object}
        content_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        blob_ref: {type: string}
        permissions: {type: object}
        state: {type: string, enum: [draft, submitted, checking, check_failed, in_review, changes_requested, approved, published, deprecated, suspended, yanked, rejected]}
        signature: {type: string}
        created_at: {type: string, format: date-time}
    Accepted:
      type: object
      properties:
        id: {type: string}
        status: {type: string}
    SubmitAssetInput:
      type: object
      additionalProperties: false
      properties:
        channel: {type: string, default: stable}
    TransitionInput:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, enum: [draft, deprecated, suspended, yanked, published]}
    ChannelInput:
      type: object
      additionalProperties: false
      required: [version_id]
      properties:
        version_id: {type: string, format: uuid}
    GrantInput:
      type: object
      additionalProperties: false
      required: [grantee_type, grantee_id, permission]
      properties:
        grantee_type: {type: string, enum: [user, service, group, workspace, tenant]}
        grantee_id: {type: string, format: uuid}
        permission: {type: string, enum: [use, maintain]}
    ReviewInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject, request_changes]}
        comment: {type: string, maxLength: 4000}
    InstallInput:
      type: object
      additionalProperties: false
      required: [asset_id]
      properties:
        asset_id: {type: string, format: uuid}
        version_constraint: {type: string, default: '*'}
        channel: {type: string}
        pinned_version_id: {type: string, format: uuid}
    LockPreviewInput:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind: {type: string, enum: [agent, team]}
        ref: {type: string}
        version: {type: string}
    RunLock:
      $ref: '../contract/v2/schema/lock.json#/$defs/RunLock'
    AssetFile:
      type: object
      required: [path, sha256, size_bytes]
      properties:
        path: {type: string}
        sha256: {type: string}
        size_bytes: {type: integer, minimum: 0}
    AssetPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        next_cursor: {type: string}
    AssetVersionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssetVersion" }
        next_cursor: {type: string}
    AssetFilePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssetFile" }
        next_cursor: {type: string}
    CheckPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {type: object}
        next_cursor: {type: string}
    ChannelPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {type: object}
        next_cursor: {type: string}
    GrantPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {type: object}
        next_cursor: {type: string}
    InstallPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {type: object}
        next_cursor: {type: string}
    APIKey:
        additionalProperties: false
        properties:
            expires_at:
                format: date-time
                type: string
            id:
                format: uuid
                type: string
            last_used_at:
                format: date-time
                type:
                    - string
                    - "null"
            name:
                type: string
            prefix:
                type: string
            principal_id:
                format: uuid
                type: string
            scopes:
                items:
                    type: string
                type: array
        required:
            - id
            - principal_id
            - name
            - prefix
            - scopes
            - expires_at
            - last_used_at
        type: object
    APIKeyCreated:
        additionalProperties: false
        properties:
            expires_at:
                format: date-time
                type: string
            id:
                format: uuid
                type: string
            key:
                type: string
            prefix:
                type: string
            scopes:
                items:
                    type: string
                type: array
        required:
            - id
