  /v1/tasks/{taskId}/config:
    get:
      tags:
      - tasks
      operationId: getTaskConfig
      description: What the task runs with. Read from the workflow, which owns it.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskConfigView'
        '404':
          description: No such task for this caller
    put:
      tags:
      - tasks
      operationId: updateTaskConfig
      description: |
        Replaces the configuration. It applies from the task's next attempt; the attempt that is running keeps what it
        started with. Send the version you read as base_config_version: a newer one in place answers 409
        CONFIG_VERSION_CONFLICT. Repeating a command_id answers the first result.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TaskConfigInput'
              - type: object
                required:
                - base_config_version
                properties:
                  base_config_version:
                    type: integer
                    minimum: 1
                  command_id:
                    type: string
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - config_version
                properties:
                  config_version:
                    type: integer
                  effective:
                    type: string
                    enum:
                    - next_attempt
        '400':
          description: Invalid input, or an expert, skill or connector this caller cannot use
        '404':
          description: No such task for this caller
        '409':
          description: CONFIG_VERSION_CONFLICT, or TASK_CLOSED
  /v1/tasks/{taskId}/plan:
