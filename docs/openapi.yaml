      required:
      - name
      - type
      - required
      - description
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        description:
          type: string
    McpMarketTool:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - params
      properties:
        name:
          type: string
        description:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/McpMarketToolParam'
    McpMarketDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - summary
      - author
      - category
      - categoryName
      - categoryMore
      - calls
      - views
      - stars
      - verified
      - hosted
      - needsOnline
      - license
      - updatedOn
      - readme
      - tools
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
        author:
          type: string
        category:
          type: string
        categoryName:
          type: string
        categoryMore:
          type: integer
        calls:
          type: integer
        views:
          type: integer
        stars:
          type: integer
        verified:
          type: boolean
        hosted:
          type: boolean
        needsOnline:
          type: boolean
        license:
          type: string
        updatedOn:
          type: string
