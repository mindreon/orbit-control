openapi: 3.0.3
info:
  title: Orbit Control API
  version: 0.3.0
  description: |
    Orbit control API: the task center (TaskWorkflow), agent profiles, SOPs and policy, artifacts,
    and the tenant catalog (assistants, connectors, skills, MCP market). Tasks are stored in Postgres
    (`ORBIT_CONTROL_DB_URL`); control drives TaskWorkflow through Temporal (`TEMPORAL_ADDRESS`). The
    event stream of a task is SSE with a durable per-task `seq` and ephemeral live frames without one.

    The agent loop runs on orbit-worker (AgentScope). This API never exposes Temporal or worker URLs.

    `Unauthorized` (401) and `Forbidden` (403) are reserved shapes for the auth layer.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://127.0.0.1:8080
  description: Local control
security: []
tags:
- name: health
  description: Liveness
- name: tasks
  description: TaskWorkflow orchestration
- name: profiles
  description: Immutable versioned agent profiles
- name: experts
  description: Custom experts, each version one immutable profile (15 M8)
- name: policy
  description: Tenant policy layer (tighten-only)
- name: sops
  description: Versioned SOP definitions
- name: personas
  description: Agent personas. Stored in Postgres when ORBIT_CONTROL_DB_URL is set.
- name: mcp-connectors
  description: MCP connector launchers. Environment references are names only.
- name: mcp-market
  description: |
    Shared ModelScope plaza snapshot stored in this service. Listing reads
    the local copy. Process start loads the shipped snapshot. This API does
    not call modelscope.cn, does not store launch commands or hosted URLs,
    and does not connect to a server.
- name: skills
  description: |
    Shared SkillHub catalog stored in this service. Listing reads the local
    copy. A background sync refreshes it. Skill packages are not downloaded
    and this API does not install them.
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: Health check
      description: 'Returns 200 `{status: ok}` without touching the database.'
      x-unimplemented: false
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/personas:
    get:
      tags:
      - personas
      operationId: listPersonas
      summary: List personas
      x-unimplemented: false
      responses:
        '200':
          description: Personas for the caller's tenant, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - personas
      operationId: createPersona
      summary: Create a persona
      description: |
        Stored for the caller's tenant. The worker renders instructions into
        an agent preset at openSession. This API never accepts secret plaintext.
      x-unimplemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonaRequest'
      responses:
        '200':
          description: Created persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          description: Missing name, or a connector id that includes a value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mcp-connectors:
    get:
      tags:
      - mcp-connectors
      operationId: listMcpConnectors
      summary: List MCP connectors
      x-unimplemented: false
      responses:
        '200':
          description: Connectors for the caller's tenant, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnectorList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - mcp-connectors
      operationId: createMcpConnector
      summary: Create an MCP connector
      description: |
        Stores how to reach an MCP server. `stdio` keeps a launch command.
        `streamable_http` keeps a URL. `envRefs` and `headerRefs` are names.
        Values are rejected. This API does not run the connector.
      x-unimplemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMcpConnectorRequest'
      responses:
        '200':
          description: Created connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnector'
        '400':
          description: Missing name or launch target, or a name that includes a value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mcp-market:
    get:
      tags:
      - mcp-market
      operationId: listMcpMarket
      summary: List the stored ModelScope MCP plaza
      description: |
        Reads the plaza snapshot stored by this service. The handler does not
        call modelscope.cn. Rows are display metadata only.
      x-unimplemented: false
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: serviceType
        in: query
        schema:
          type: string
          enum:
          - hosted
          - local
      - name: needsOnline
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: source
        in: query
        schema:
          type: string
          enum:
          - common
          - nexa
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 48
      responses:
        '200':
          description: One page of the stored plaza. items is empty until startup stores the snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpMarketList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mcp-market/{id}:
    get:
      tags:
      - mcp-market
      operationId: getMcpMarket
      summary: Read one stored MCP server
      description: |
        Reads one plaza server and its readme and tool list from this service.
        The handler does not call modelscope.cn. Hosted connection URLs and
        discussion threads are not stored.
      x-unimplemented: false
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored server. readme and tools may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpMarketDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No stored server has this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/mcp-market/{id}/icon:
    get:
      tags:
      - mcp-market
      operationId: getMcpMarketIcon
      summary: Read one stored server's card icon
      description: |
        Returns the icon bytes the icon sidecar stored for this server. 404
        when the server has no icon or the sidecar did not ship it.
      x-unimplemented: false
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The icon bytes, with its image content type.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No stored icon for this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mcp-market-categories:
    get:
      tags:
      - mcp-market
      operationId: listMcpMarketCategories
      summary: List stored plaza categories
      description: |
        Reads category labels stored with the plaza snapshot. Counts follow
        the needsOnline filter. Does not call modelscope.cn.
      x-unimplemented: false
      parameters:
      - name: needsOnline
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Category labels that have at least one stored server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpMarketCategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skills:
    get:
      tags:
      - skills
      operationId: listSkills
      summary: List the stored ModelScope skills snapshot
      description: |
        Reads the skills snapshot stored by this service. The handler does not
        call modelscope.cn. The snapshot ships with the binary; when
        ORBIT_CATALOG_DIR provides skills_text.json.gz, file text is filled too.
        This operation does not install a skill.
      x-unimplemented: false
      parameters:
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - downloads
          - likes
          - updated_at
      - name: category
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
          enum:
          - common
          - nexa
      - name: keyword
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 48
      responses:
        '200':
          description: One page of the stored catalog. items is empty until startup stores the snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skills/{handle}/{slug}:
    get:
      tags:
      - skills
      operationId: getSkill
      summary: Read one stored skill
      description: |
        Reads one row of the stored snapshot. The handler does not call
        modelscope.cn, and it does not download or install the skill package.
      x-unimplemented: false
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored skill. The description is the saved summary, not a package file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '404':
          description: No stored row matches this handle and slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skills/{slug}:
    get:
      tags:
      - skills
      operationId: getSkillBySlug
      summary: Read one stored skill by slug alone
      description: |
        The ModelScope snapshot always carries a handle, so this route answers
        404. Kept for older links that address a skill without its author.
      x-unimplemented: false
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored skill.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '404':
          description: No stored row matches this slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skill-files/{handle}/{slug}:
    get:
      tags:
      - skills
      operationId: listSkillFiles
      summary: Read the text files stored beside one skill
      description: |
        Returns the text files the snapshot stored beside the skill. The text
        arrives with the skills_text.json.gz sidecar (ORBIT_CATALOG_DIR);
        without it, or before the text pass has run, items is empty.
        The files are not installed or executed, and this response is not a zip.
      x-unimplemented: false
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Saved text files. items is empty when the package had none we keep.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillTextFileList'
        '404':
          description: No stored skill matches this handle and slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skill-files/{slug}:
    get:
      tags:
      - skills
      operationId: listSkillFilesBySlug
      summary: Read text files addressed by slug alone
      description: |
        Same as listSkillFiles. The ModelScope snapshot always carries a
        handle, so this route answers 404.
      x-unimplemented: false
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Saved text files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillTextFileList'
        '404':
          description: No stored skill matches this slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skills/{handle}/{slug}/icon:
    get:
      tags:
      - skills
      operationId: getSkillIcon
      summary: Read one skill's card icon
      description: |
        Returns the icon bytes the icon sidecar stored for this skill. 404
        when the skill has no icon or the sidecar did not ship it.
      x-unimplemented: false
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The icon bytes, with its image content type.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No stored icon for this skill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/skill-categories:
    get:
      tags:
      - skills
      operationId: listSkillCategories
      summary: List stored skill category labels
      description: Reads labels stored with the snapshot. Does not call modelscope.cn.
      x-unimplemented: false
      responses:
        '200':
          description: Category labels, ordered by sortOrder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/agents:
    get:
      tags:
      - agents
      operationId: listAgents
      summary: List the stored ModelScope agents snapshot
      description: |
        Reads the agents snapshot stored by this service. The handler does not
        call modelscope.cn. This operation does not run an agent.
      x-unimplemented: false
      parameters:
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - downloads
          - stars
          - updated_at
      - name: catalogue
        in: query
        schema:
          type: string
      - name: keyword
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 48
      responses:
        '200':
          description: One page of the stored agents. items is empty until startup stores the snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/agents/{handle}/{slug}:
    get:
      tags:
      - agents
      operationId: getAgent
      summary: Read one stored agent
      description: |
        Reads one agent row with its files. The handler does not call
        modelscope.cn, and it does not run the agent.
      x-unimplemented: false
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: No stored agent matches this handle and slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/agents/{slug}:
    get:
      tags:
      - agents
      operationId: getAgentBySlug
      summary: Read one stored agent by slug alone
      description: |
        The snapshot always carries a handle, so this route answers 404.
        Kept for older links that address an agent without its author.
      x-unimplemented: false
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: No stored agent matches this slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/agents/{handle}/{slug}/icon:
    get:
      tags:
      - agents
      operationId: getAgentIcon
      summary: Read one agent's logo
      description: |
        Returns the logo bytes the icon sidecar stored for this agent. 404
        when the agent has no logo or the sidecar did not ship it.
      x-unimplemented: false
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The logo bytes, with its image content type.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No stored logo for this agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tasks:
    get:
      tags:
      - tasks
      operationId: listTasks
      summary: List task workflows
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      tags:
      - tasks
      operationId: createTask
      summary: Create and start a TaskWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /v1/profiles:
    get:
      tags:
      - profiles
      operationId: listProfiles
      responses:
        '200':
          description: Immutable profile versions
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
    post:
      tags:
      - profiles
      operationId: registerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProfileRequest'
      responses:
        '201':
          description: Profile registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
  /v1/profiles/{profileRef}:
    get:
      tags:
      - profiles
      operationId: getProfile
      parameters:
      - name: profileRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Immutable profile version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
  /v1/experts:
    get:
      tags:
      - experts
      operationId: listExperts
      responses:
        '200':
          description: The latest version of each expert of the tenant
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Expert'
    post:
      tags:
      - experts
      operationId: createExpert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertInput'
      responses:
        '201':
          description: Expert created as version 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expert'
        '400':
          description: Invalid input, or a connector id that is not the tenant's (the same answer for both)
  /v1/experts/{expertId}:
    get:
      tags:
      - experts
      operationId: getExpert
      parameters:
      - name: expertId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The latest version of the expert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expert'
        '404':
          description: No such expert in this tenant
    put:
      tags:
      - experts
      operationId: updateExpert
      description: Replaces the expert's content as a new version. Earlier versions never change.
      parameters:
      - name: expertId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertInput'
      responses:
        '200':
          description: The new latest version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expert'
        '400':
          description: Invalid input, or a connector id that is not the tenant's
        '404':
          description: No such expert in this tenant
        '409':
          description: Another update took the next version first; read and retry
  /v1/policy:
    get:
      tags:
      - policy
      operationId: getTenantPolicy
      responses:
        '200':
          description: The tenant-wide policy, the outermost layer (05 §6)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
    put:
      tags:
      - policy
      operationId: setTenantPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200':
          description: The policy now in force. Tasks and profiles can only tighten it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
  /v1/sops:
    get:
      tags:
      - sops
      operationId: listSOPs
      responses:
        '200':
          description: Immutable SOP versions
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SOP'
    post:
      tags:
      - sops
      operationId: registerSOP
