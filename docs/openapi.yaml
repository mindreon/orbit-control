      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: unauthorized
            code: UNAUTHORIZED
            message: missing or invalid credentials
    Forbidden:
      description: |
        Stub for later Sentinel tests. Authenticated caller lacks permission.
        Reserved for the auth layer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: forbidden
            code: FORBIDDEN
            message: insufficient permissions
